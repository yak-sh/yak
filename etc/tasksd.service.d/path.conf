# The hosted-agent PATH deployment contract (T-16728).
#
# This drop-in is the SINGLE tracked source of truth for the toolchain
# directories tasksd guarantees to the agents it spawns. Two consumers read
# THIS file, so the value can never drift from the repo:
#   - systemd, which sets tasksd's own PATH from it (a drop-in's Environment=
#     for a variable overrides the same variable set in the main unit, because
#     drop-ins are read after it);
#   - src/agent_env.ts, which derives every hosted/managed agent's PATH from it
#     at spawn time — so a stale running unit still yields the tracked PATH.
#
# A missing provider dir is exit 127 for that agent (M-17876), which is exactly
# what this contract prevents: ~/.deno/bin carries `task`, Linuxbrew carries
# deno/git/gh/node/brew, and the provider CLIs (claude, codex) resolve here.
# Interactive zsh startup files are deliberately NOT sourced — they carry side
# effects, duplicates, and transient paths; this list is deterministic.
#
# %h is the systemd specifier for the service user's home; src/agent_env.ts
# substitutes $HOME for the same token, so the contract stays home-agnostic.
#
# Install (as the tasksd host user, e.g. yaks):
#   sudo mkdir -p /etc/systemd/system/tasksd.service.d
#   sudo ln -sf "$PWD/etc/tasksd.service.d/path.conf" \
#     /etc/systemd/system/tasksd.service.d/path.conf
#   sudo systemctl daemon-reload && sudo systemctl restart tasksd
[Service]
Environment=PATH=%h/.deno/bin:%h/.local/bin:%h/bin:%h/sbin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
