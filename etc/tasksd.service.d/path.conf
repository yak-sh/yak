# The hosted-agent PATH deployment contract (T-16728).
#
# This drop-in is the SINGLE tracked source of truth for the toolchain
# directories the graph server guarantees to the agents it spawns. systemd sets
# the unit's own PATH from it, and a spawned agent inherits the unit's
# environment (@yaks/spawn hands a child the server's own PATH), so the
# contract cannot drift from the repo. It used to have a second reader,
# src/agent_env.ts, which derived the same line at spawn time; that went with
# the fleet server (T-37584) and the inheritance is now the whole mechanism —
# which means a change here reaches agents only once the unit is restarted.
#
# A missing provider dir is exit 127 for that agent (M-17876), which is exactly
# what this contract prevents: ~/.deno/bin carries `yak` (and `task`, its
# alias), Linuxbrew carries deno/git/gh/node/brew, and the provider CLIs
# (claude, codex) resolve here.
# Interactive zsh startup files are deliberately NOT sourced — they carry side
# effects, duplicates, and transient paths; this list is deterministic.
#
# %h is the systemd specifier for the service user's home, so the contract
# stays home-agnostic.
#
# Install (as the host user, e.g. yaks):
#   sudo mkdir -p /etc/systemd/system/tasksd.service.d
#   sudo ln -sf "$PWD/etc/tasksd.service.d/path.conf" \
#     /etc/systemd/system/tasksd.service.d/path.conf
#   sudo systemctl daemon-reload && sudo systemctl restart tasksd
#
# The unit itself runs `deno task dev`, which is `yak serve --config
# etc/yak.json` (deno.json): one config, one SQLite file, the plugins it names.
[Service]
Environment=PATH=%h/.deno/bin:%h/.local/bin:%h/bin:%h/sbin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
