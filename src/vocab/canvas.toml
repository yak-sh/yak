# The canvas plugin (D-22530 §8): the spatial UI vocabulary — canvases,
# cards, pins, per-client chrome (camera/fold/shelf/cursor), tiling layouts.

name = "canvas"

# A container pane lays its children along this axis: h = side by side,
# v = stacked.
[enums.dirs]
rank = 100
values = ["h", "v"]

[comps.canvas]
rank = 120
kind_rank = 60
by_name = true

# A tiling layout (D-14718): the doc names it, root its top pane. Shared
# like a board — fork is an explicit gesture, never copy-on-write. death
# 'detach' on purpose: deleting the root pane directly orphans the layout
# to an empty state instead of chaining a second cascade back through it.
[comps.layout]
rank = 80
kind_rank = 40
prefix = "L"
by_name = true
[comps.layout.cols]
root = { eid = "pane", death = "detach" }

# One pane of a layout: a CONTAINER when dir is set (children are the panes
# whose parent names it, ordered by `order`), a LEAF otherwise (content +
# view, card's pair; both absent = empty → the palette). size is a WEIGHT
# among siblings — renderers divide by the siblings' sum, so closing a pane
# renormalizes the rest with no array to splice. content is a SOFT ref: the
# shown entity's death empties the pane.
[comps.pane]
rank = 90
kind_rank = 90
[comps.pane.cols]
layout = { eid = "layout", death = "cascade" }
parent = { eid = "pane", death = "cascade" }
size = "number"
order = "number"
dir = { enum = "dirs" }
content = { eid = "entity", death = "detach" }
view = "text"

[comps.card]
rank = 150
kind_rank = 80
[comps.card.cols]
target = { eid = "entity", death = "cascade" }
view = "text"

[comps.pin]
rank = 160
[comps.pin.cols]
canvas = { eid = "entity", death = "cascade" }
x = "number"
y = "number"
w = "number"
h = "number"
z = "number"

# actor is the identity CHAIN: a client is one browser's presence, a
# session one agent's run — instruments, not identities — and the actor is
# who the instrument acts for (a person, or a project standing in for its
# operator). An assertion, not authentication — forging it only garbles
# your own attribution. ip is server-stamped.
[comps.client]
rank = 170
kind_rank = 100
stamped_rank = 120
[comps.client.cols]
user_agent = "text"
actor = { eid = "entity", death = "detach" }
[comps.client.stamped]
ip = "text"

[comps.camera]
rank = 180
kind_rank = 110
[comps.camera.cols]
client = { eid = "client", death = "cascade" }
canvas = { eid = "entity", death = "cascade" }
x = "number"
y = "number"
zoom = "number"
w = "number"
h = "number"
[[comps.camera.indexes]]
cols = ["client", "canvas"]
unique = true

[comps.fold]
rank = 190
kind_rank = 120
[comps.fold.cols]
client = { eid = "client", death = "cascade" }
board = { eid = "board", death = "cascade" }
statuses = "text"
[[comps.fold.indexes]]
cols = ["client", "board"]
unique = true

# Binds a client to their tray canvas. 'release' on purpose: a dead
# client's shelf sheds the tag, the canvas (and whatever it holds) survives
# as a plain canvas — the binding was the client's, the contents aren't.
[comps.shelf]
rank = 200
[comps.shelf.cols]
client = { eid = "client", death = "release" }
[[comps.shelf.indexes]]
cols = ["client"]
unique = true

# WHERE a client is LOOKING — navigation as graph data (T-12788). One row
# per client, written by nav.tsx on navigate the way camera writes on pan.
# `target` is the entity fullscreened (the URL is still the position; this
# mirrors it into the graph), `view` its ?v= tab. Two directions ride one
# row: the browser WRITES it to publish where it is, and an AGENT writes it
# to MOVE the human's open tab. death 'keep' on target on purpose: a cursor
# aimed at a dead entity keeps the tombstone and the reader derives a
# nearest-live fallback at READ time — never a self-healing repair write.
# Movement is not membership: back-navigation MOVES the cursor, never
# removes it.
[comps.cursor]
rank = 210
kind_rank = 130
[comps.cursor.cols]
client = { eid = "client", death = "cascade" }
target = { eid = "entity", death = "keep" }
view = "text"
[[comps.cursor.indexes]]
cols = ["client"]
unique = true
