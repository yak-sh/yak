# The comms plugin (D-22530 §8, provisional grouping): attention and
# delivery — knocks, wakes, subscriptions, and the shared deliver/
# delivered/error triad every deliverable wears.

name = "comms"

# What an actor has said about a thread, overriding the addressed-to
# default. There is no 'auto': absent IS auto, because auto is exactly what
# addressed() already does — a stored default is a row that means nothing
# and can drift out of step with the rule it duplicates.
[enums.subModes]
rank = 110
values = ["watch", "mute"]

# An actor's standing instruction about ONE entity: watch it even though
# nothing is aimed at me, or mute it though something is. Read as an
# override on the item's TARGET. Both ends cascade: a muted thread's
# subscription dies with it.
[comps.subscription]
rank = 610
kind_rank = 190
[comps.subscription.cols]
actor = { eid = "entity", death = "cascade" }
target = { eid = "entity", death = "cascade" }
mode = { enum = "subModes" }
[[comps.subscription.indexes]]
cols = ["actor", "target"]
unique = true

# A knock: bring THIS entity to THAT actor's attention, NOW. The artifact
# of an attention ask (always minted, GC-able later — the record is what
# makes delivery debuggable); words ride as a plain comment on the target
# in the same batch, never in the knock. The resolver effect (knock.ts)
# walks the ladder — running session hears the cast, a project with nobody
# running spawns onto the target, a person gets mail — and stamps what it
# did. WHO should look is the `deliver {to}` facet, not a column here.
[comps.knock]
rank = 640
kind_rank = 210
prefix = "K"
[comps.knock.cols]
target = { eid = "entity", death = "cascade" } # what to look at

# A wake is a knock with a clock: the same sentence, said LATER. `at` is
# absolute — the caller writes a phrase ('in 60m') and it resolves once, at
# mint (query.ts instant), because a row that still holds a phrase would
# mean something different every time it is read. The server keeps one
# timer at the earliest pending wake and reconciles at boot, so an hour of
# downtime delays a wake instead of eating it (wake.ts) — then mints the
# knock and lets that ladder deliver. No repeats: `every` waits for
# something that needs it. WHO to wake is the `deliver {to}` facet.
[comps.wake]
rank = 650
kind_rank = 220
prefix = "W"
[comps.wake.cols]
at = "time"
# What to look at on waking — absent means the wake itself.
target = { eid = "entity", death = "cascade" }
# A note written when the wake was set — what the setter was mid-doing, why
# it will return. It rides through to the delivered knock's words, so a
# resumed session reconstitutes instead of guessing.
note = "text"

# Addressing as a facet (D-14945): WHERE a deliverable goes. `to` names a
# graph ENTITY — a session or actor (knock/wake), an address-book entity
# (mail) — never a raw string: an external address IS an `email` entity,
# and a raw @-address written here is find-or-minted into one at the door
# (db.ts mintAddresses). One aspect, one component, worn by knock/wake/
# outbound-mail; `deliver`→`delivered`→`error` is intent→success→failure,
# one letter apart because the tense is the state. death 'keep': a
# deliverable is a debuggable record — history outlives its recipient's
# tombstone, and the effects stay inert on a dead `to`. Wire-writable:
# naming the recipient IS the ask. NOT in kindOrder — a facet.
[comps.deliver]
rank = 890
[comps.deliver.cols]
to = { eid = "entity", death = "keep" }

# Outcome and health (D-14945): `delivered` says an entity reached its
# destination (`via` = how it went out — cast S-9 / spawned S-9 / local / a
# mail's Message-ID — descriptive text, not an eid); `error` says an effect
# failed (`message` = why). Deliverables are tri-state — delivered, error,
# or neither (pending) — while role/session/freeze wear the same error
# facet, making `.error` the fleet health query. Both server-owned and
# EFFECT-written: the wire writes neither column. NOT in kindOrder.
[comps.delivered]
rank = 900
stamped_rank = 150
[comps.delivered.stamped]
at = "time"
via = "text"

# `error` is a KNOWN/expected failure state (bad address, unavailable
# dependency, rate-limit) — worth surfacing, NOT a bug — so it does not
# trigger self-healing. The BREAK facet is `exception` (kernel); the
# T-17081 audit sorts each current error writer into one or the other.
[comps.error]
rank = 910
stamped_rank = 160
[comps.error.stamped]
at = "time"
message = "text"
