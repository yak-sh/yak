# Plugin zero — the kernel's own vocabulary (D-22530 §1): the comps that ARE
# the graph mechanics, declared in the same manifest format it demands of
# every plugin. Also kernel-owned singletons: the renames table (global,
# add-only) and the edge vocabulary.
#
# Ranks are the global emission order (unique across all manifests; the old
# hand-written types.ts order, ×10). kind_rank orders kindOrder the same way;
# stamped_rank the stamped map.

name = "kernel"

# The edge vocabulary — every edge reads as a sentence, parent first:
#   parent requires child   hard gate
#   parent contains child   decomposition, children roll up
#   parent reads child      read-first, never gates
#   parent about child      subject reference; never gates
#   parent supervises child
#   parent delegates child  session lineage (T-16412): the parent run
#                           spawned the child run; apply() mirrors
#                           session.parent into this edge
#   parent recalled child   a recall-floater entry names the memories it
#                           surfaced — the per-session dedup ledger
#   parent supersedes child the current entity replaces an older one; the
#                           superseded end stays visible, never hidden
#   parent worked child     a session once held the task's claim — durable
#                           session history as an indexed graph read
#   parent referenced child an entry's mechanical citation (referenced.ts)
#   parent wants child      a persona's pending spawn mark (spawnrule.ts)
# The LIST is the source of truth: db.ts bakes it into the dependency
# table's check constraint, so a new verb here is a new verb everywhere.
edges = [
  "requires",
  "contains",
  "reads",
  "about",
  "supervises",
  "delegates",
  "recalled",
  "supersedes",
  "worked",
  "referenced",
  "wants",
]

# What a notice records — the kinds of thing that happened but nobody said
# (D-13858). `lapse` a session's lease went unreleased at wrap, `sweep` a
# background sweep found something, `scene` a `:fix` capture. A closed set
# like statuses: the mint sites (T-11046) name one of these.
[enums.noticeKinds]
rank = 140
values = ["lapse", "sweep", "scene"]

# The spine: identity and nothing else — birth and last-edit are the
# created/updated components. Stamped-only (wire = false): num is
# server-minted on first touch.
[comps.entity]
wire = false
stamped_rank = 10
[comps.entity.stamped]
num = "number"

# The written face of an entity — title and markdown body. Anything can
# carry one.
[comps.doc]
rank = 10
kind_rank = 360
[comps.doc.cols]
title = "text"
body = "body"

# An attached file (T-12781). The entity carries only the METADATA — the
# bytes live beside the db at ~/.tasks/blobs/<sha>, content-addressed,
# served at GET /blob/<sha>. Never base64 in a column, never in snapshot(),
# never in a client cache. One aspect — "this entity has a file" (M-14942) —
# worn by ANY entity: a bare blob IS a file. Wire-writable: the upload door
# (POST /blob) stores the bytes and stamps this through apply(); a forged
# sha only aims a card at bytes that aren't there.
[comps.blob]
rank = 140
kind_rank = 350 # ahead of doc: a named file still reads as a blob
[comps.blob.cols]
mime = "text"
name = "text"
sha = "text"
bytes = "number"
w = "number"
h = "number"

# A non-secret runtime override, keyed by a catalog entry (config.ts). The
# code catalog owns what a setting IS; this component holds only the
# OVERRIDE for a known key, unique by key. apply() validates against the
# catalog and refuses unknown or malformed keys — SECRETS never wear this
# component (credentials.ts). NOT in kindOrder: addressed by key, never num.
[comps.setting]
rank = 230
[comps.setting.cols]
key = "text"
value = "text"

# Shared navigation is a graph fact, not one client's chrome. A favorite
# remains whatever kind it already was, so this facet stays out of
# kindOrder. Its server-frozen `at` records when it joined navigation;
# removing and re-adding starts a new tenure.
[comps.favorite]
rank = 220
stamped_rank = 80
[comps.favorite.stamped]
at = "time"

# A comment is a doc AIMED at something — and since target is any entity,
# ANYTHING is commentable: tasks, boards, frozen pages, other comments.
[comps.comment]
rank = 710
kind_rank = 300
[comps.comment.cols]
target = { eid = "entity", death = "cascade" }

# A notice: something happened ABOUT this entity that nobody said (D-13858).
# Not a comment — emitted, not said: not in the conversation, not counted as
# one, never reaches the mail relay. `event`, not `kind`: `.kind` is the
# universal listing scope (query.ts), and a column of that name would shadow
# it. Wire-writable (the mint sites are headless doors); death cascade like
# comment.target. Same shape as comment, so it DERIVES its table (db.ts).
[comps.notice]
rank = 720
kind_rank = 290
[comps.notice.cols]
target = { eid = "entity", death = "cascade" }
event = { enum = "noticeKinds" }

# A quiet transcript memo (T-17319): a bare tag a comment wears to say
# "harvest at consolidation, never inject live". channel.ts excludes a
# meta-tagged comment from live delivery, so the note reaches the dream
# combing the session — never the doer mid-task. Not in kindOrder — a
# comment that carries meta is still a comment.
[comps.meta]
rank = 730

# A stable external name for an entity — a slug from a previous system, a
# human handle. `slug` is the PRIMARY handle (db.ts human()), `slugs` a
# space-delimited set of additional resolvable-only names. Every member is
# unique graph-wide, enforced at write in apply().
[comps.alias]
rank = 750
kind_rank = 380
[comps.alias.cols]
slug = "text"
slugs = "text"

# A value the graph deliberately forgot. The removed bytes never ride this
# facet: target + column say where, hash proves which value, and the
# universal created stamp says when/by/via. Server-owned and permanent;
# db.ts's redact transaction is its only writer.
[comps.redaction]
rank = 690
kind_rank = 270
prefix = "X" # e-X-cision: R is the roles'
stamped_rank = 240
[comps.redaction.stamped]
target = { eid = "entity", death = "keep" }
column = { enum = ["title", "body"] }
hash = "text"

# A claim that BOUNCED, kept as an entity: who tried (loser), who held
# (holder) — resolved to session-id strings at rejection time, because the
# loser's session entity may have been minted in the very batch that rolled
# back. Server-minted only; audit contention with graph_query kind=conflict.
# Audit rows outlive everything they mention: the target reference stands
# even after the target dies.
[comps.conflict]
rank = 680
kind_rank = 260
stamped_rank = 230
[comps.conflict.stamped]
target = { eid = "entity", death = "keep" }
loser = "text"
holder = "text"
at = "time"

# Server-minted recall aggregates — count·first_at·last_at is the decay
# model's whole memory (query.ts hot() derives rank at read). Nothing is
# wire-writable; db.ts touch() is the one writer. Keyed by eid like any
# comp, so ANY entity can grow warm — rank is graph-wide.
[comps.recall]
rank = 820
stamped_rank = 220
[comps.recall.stamped]
count = "number"
first_at = "time"
last_at = "time"

# Provenance, when+who+how paired (T-6670/T-7113): `created` set once at
# write, `updated` the LAST edit — ABSENT until the first real modification.
# `at` is server-stamped/frozen; `by` is wire-writable — the server defaults
# it to the writing instrument's actor (db.ts writerActor), and the wire may
# override it (an agent stamping Jeff as the author). `via` is the
# server-stamped instrument: claiming another instrument is only spoofing.
# Both death 'keep' — provenance outlives the actor's tombstone. NOT in
# kindOrder: a facet every entity wears, never its identity.
[comps.created]
rank = 830
stamped_rank = 20
[comps.created.cols]
by = { eid = "entity", death = "keep" }
[comps.created.stamped]
at = "time"
via = { eid = "entity", death = "keep" }

[comps.updated]
rank = 840
stamped_rank = 30
[comps.updated.cols]
by = { eid = "entity", death = "keep" }
[comps.updated.stamped]
at = "time"
via = { eid = "entity", death = "keep" }

# Notification lifecycle — the inbox's read-state (T-7006). Each is a
# PRESENCE stamp: the wire writes the bare component to REQUEST the act,
# the server freezes the clock (`at`) and the actor (`by`/`via`). Monotonic
# and independent: an item can be `opened` without `notified`, `archived`
# without `opened`. Only `archived` hides an inbox item, which is what makes
# it drain-proof. NOT in kindOrder: facets any entity wears.
[comps.notified] # a human operator has been told — agents never wear this
rank = 850
stamped_rank = 40
[comps.notified.stamped]
at = "time"
by = { eid = "entity", death = "keep" }
via = { eid = "entity", death = "keep" }

[comps.opened] # the operator has looked — NOT opened == unread; never hides
rank = 860
stamped_rank = 50
[comps.opened.stamped]
at = "time"
by = { eid = "entity", death = "keep" }
via = { eid = "entity", death = "keep" }

[comps.archived] # the operator is done — hides an inbox item
rank = 870
stamped_rank = 60
[comps.archived.stamped]
at = "time"
by = { eid = "entity", death = "keep" }
via = { eid = "entity", death = "keep" }

# A safety boundary over ANY entity. Presence hides it from every list and
# replaces direct rendering with an explicit reveal; the server signs the
# whole stamp so graph content cannot forge who quarantined it or when.
# NOT in kindOrder: quarantine never changes what the entity is.
[comps.quarantined]
rank = 880
stamped_rank = 70
[comps.quarantined.stamped]
at = "time"
by = { eid = "entity", death = "keep" }
via = { eid = "entity", death = "keep" }

# The BREAK facet (D-17077): our code/process hit something UNEXPECTED — a
# thrown exception, exit 127, a died process, a violated invariant. The
# self-healing trigger (heal.ts). `stack` optional and rides ON the facet —
# the same fault, the same aspect as message (M-14942), never its own comp.
# Server-owned/effect-written, mirroring error.
[comps.exception]
rank = 920
stamped_rank = 170
[comps.exception.stamped]
at = "time"
message = "text"
stack = "text"

# The git-anchor facet (D-18378): the revision an entity was VERIFIED
# against — "this prose was true as of this commit" — worn by ANY git-tied
# entity. `paths` are repo-relative paths/globs (newline- or comma-
# separated); `sha` the commit last verified against. All wire-writable:
# naming the sha they checked IS the anchor; `task stale` re-derives truth
# from git at read time — staleness is never stored. The EXACT tiers
# (D-21211), stablest first, each optional, each about the FIRST path:
# `symbol` names a declaration; `hunk` is the region's raw text at anchor
# time, relocatable by search; `start`/`end` its 1-based inclusive lines at
# `sha`. Resolution is tri-state — fresh / moved / broken — never silently
# wrong. NOT in kindOrder.
[comps.anchor]
rank = 980
[comps.anchor.cols]
paths = "text"
sha = "text"
symbol = "text"
hunk = "body"
start = "number"
end = "number"

# A decision was TAKEN about this entity — a facet, never an identity. The
# same {at, by, via} stamp, split differently: `at` and `by` are WIRE-
# writable, because a decision is routinely written up long after it was
# made, and dating them all "today" throws away the one fact the component
# exists to carry. `via` stays server-only, so the INSTRUMENT cannot be
# claimed even when the date is asserted. Deliberately NOT decay-exempt.
# `verdict` (D-21212): which way it went — a declined thing is decided-
# against, not un-decided. Absent verdict reads as approved.
[comps.decided]
rank = 990
stamped_rank = 90
[comps.decided.cols]
at = "time"
by = { eid = "entity", death = "keep" }
verdict = { enum = ["approved", "declined"] }
[comps.decided.stamped]
via = { eid = "entity", death = "keep" }

# An idea from the fleet awaiting acceptance. Mirrors `decided`: the
# proposer and proposal date may be recorded after the fact, while the
# instrument stays server-owned. Absence is self-authorizing work.
[comps.proposed]
rank = 1000
stamped_rank = 100
[comps.proposed.cols]
at = "time"
by = { eid = "entity", death = "keep" }
[comps.proposed.stamped]
via = { eid = "entity", death = "keep" }

# Old spellings that still resolve — the compatibility promise in data. A
# rename ADDS a row here and NEVER removes it: a stored value, an old `?v=`
# URL, or a third-party fragment written a year ago keeps answering. A key
# is namespaced by what it renames: `view:Old` for a renderer view name
# (registry.ts resolve), `comp.col` (or bare `comp`) for a graph name whose
# VALUE is its new spelling (db.ts admitted rewrites the write, query.ts
# route the filter). schema.ts publishes this table into the boot Vocabulary
# doc — the rename history IS the graph's own changelog.
[renames]
"view:Show" = "Full"
"view:Id" = "Inline"
"view:List.Item" = "List.Tile"
"view:Task.Row" = "Board.List.Tile"
"view:Debug.ListItem" = "Debug.Tile"
