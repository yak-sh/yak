# The sessions plugin (D-22530 §8): session identity + lifecycle, the
# graph-native Session-log vocabulary (log = true comps → sessionComps),
# claims/resume, spawn, and the session capability lists.

name = "sessions"

# A managed session is still going in exactly these statuses; every other
# one is an ending. One list: the server decides what may be stopped by it,
# the browser decides what to keep polling by it.
session_active = ["starting", "running", "stopping"]

# `spawn` means a server accepts the canonical spawn component. Its absence
# tells a client to send only legacy session aliases. The token survives
# alias retirement.
capabilities = ["spawn", "session-facets"]
session_facets = ["spawn", "worktree", "runtime"]

# A provider hook says whether its composer is between turns. Delivery uses
# this positive boundary instead of guessing from terminal animation.
[enums.turnStates]
rank = 20
values = ["idle", "busy"]

# Session-log messages and provider HTTP calls each keep one canonical
# spelling. These lists feed the graph schema, editors, and MCP grammar.
[enums.messageRoles]
rank = 30
values = ["user", "agent"]

[enums.httpMethods]
rank = 40
values = ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE"]

# A session's identity and configuration. The launch/worktree/runtime
# columns at the tail are rolling aliases: old doors may still write them
# while apply() mirrors them into their canonical optional facets. The
# lifecycle columns in stamped are server-owned — no client can fake a
# status, a branch, or a final answer (sessions.ts owns every write).
[comps.session]
rank = 240
kind_rank = 150
prefix = "S"
stamped_rank = 260
[comps.session.cols]
id = "text"
cwd = "text"
# The provider process this session runs in — the SessionStart hook walks
# /proc and stamps it. Claude's channel binds by it; Codex's log follower
# uses it as liveness. Wire-writable like id/cwd: forging it only misroutes
# your own mail.
pid = "number"
# The native terminal surface inherited by a provider hook. It is an
# address, not authority: the server revalidates its process tree before
# using it.
pane = "text"
turn = { enum = "turnStates" }
# The provider's own transcript JSONL — an EXTERNAL session's durable log.
# A REFERENCE, not a capability: the server confines it to the
# provider-owned stores (sessions.ts).
transcript = "text"
# What KIND of session this is, self-reported at SessionStart: agent_type
# when launched `claude --agent <name>`; source is the boot mode
# (startup|resume|clear|compact|fork). A forged value only mislabels your
# own row.
agent_type = "text"
source = "text"
# Positive capability granted by a provider launcher's `--operator`. It
# gates project-wide attention, never ordinary graph participation.
operator = "bool"
provider = "text"
model = "text"
effort = "text"
requested_task = { eid = "entity", death = "detach" }
# Role membership is launch history. A deleted role closes its process, but
# the sessions that served it keep saying which role they served.
role = { eid = "role", death = "keep" }
persona = { eid = "entity", death = "detach" }
actor = { eid = "entity", death = "detach" } # who this run acts for
# The session that spawned this one: a delegated agent reifies as a CHILD
# of the operator rather than a second writer on one row. Lineage, not
# capability; a dead parent detaches, the child lives on.
parent = { eid = "session", death = "detach" }
[comps.session.stamped]
# Content-free wake-up audit: token is an opaque attempt id, notice_at when
# the door accepted it, notice_accepted_at the later busy-turn hook proving
# the provider consumed Enter. Server-only so a session cannot forge
# delivery.
notice_at = "time"
notice_accepted_at = "time"
notice_token = "text"
origin = { enum = ["external", "managed"] }
branch = "text"
base_revision = "text"
status = "text" # starting|running|stopping, then how it ended
provider_session_id = "text"
serving_model = "text"
latest_seq = "number"
# A native session's log-derived standing — busy|terminal|idle —
# MATERIALIZED so SessionDot reads it O(1) instead of scanning the entry
# log per render. Maintained at the codex write edge (sessions.ts).
standing = "text"
started_at = "time"
stop_requested_at = "time"
# A steer arrived mid-turn: a managed print run is yielding its current
# provider turn to new words, then continuing the same thread. Server-set
# via stamp(), a lifecycle peer of stop_requested_at.
input_at = "time"
finished_at = "time"
exit_code = "number"
stop_reason = "text"
final_text = "body"
usage_json = "text"
# The process's stderr tail — the bounded diagnostic that rides BESIDE the
# transcript (D-16704), never inside it. Imported into the graph so every
# reader shows it without a file-read side-channel (T-16798), capped at
# 8KB. Empty for a graph-native run.
stderr = "body"

# The handoff a session leaves for its successor (D-19459): "what the next
# run needs to know", NOT this session's own record (that is doc, free for
# the scribe). Written via `task session brief`, or captured from the
# session's final message at wrap; shown IN FULL under `## previously` in
# the successor's digest. Not in kindOrder.
[comps.brief]
rank = 250
[comps.brief.cols]
text = "body"

# Where code work happens, independently of how the model runs. A coding
# session wears this; chat may omit it. Branch facts are server-stamped.
[comps.worktree]
rank = 260
stamped_rank = 270
[comps.worktree.cols]
cwd = "text"
[comps.worktree.stamped]
branch = "text"
base_revision = "text"

# A provider process binding, independently of whether code needs a
# checkout. Graph-native sessions omit it; process-backed sessions wear it.
[comps.runtime]
rank = 270
stamped_rank = 280
[comps.runtime.cols]
pid = "number"
pane = "text"
transcript = "text"
[comps.runtime.stamped]
provider_session_id = "text"
serving_model = "text"

# --- The Session-log vocabulary (log = true → sessionComps) ---------------
# The always-first user entry is session context, not conversation
# (instruction); lease/usage/imported are whole-component server-owned —
# their empty writable declarations keep generic graph machinery complete;
# apply() refuses clients at the component boundary.

[comps.entry]
rank = 280
log = true
lazy = true # the log partition — 110k+ rows no browser boots with
kind_rank = 160
stamped_rank = 290
[comps.entry.cols]
session = { eid = "session", death = "cascade" }
[comps.entry.stamped]
seq = "number"
[[comps.entry.indexes]]
cols = ["session", "seq"]
unique = true

[comps.content]
rank = 290
log = true
[comps.content.cols]
body = "body"

[comps.message]
rank = 300
log = true
[comps.message.cols]
role = { enum = "messageRoles" }

# The always-first user entry is session context, not conversation. Its own
# facet lets every transcript face fold it without inferring from seq.
[comps.instruction]
rank = 310
log = true

[comps.attention]
rank = 320
log = true

[comps.generation]
rank = 330
log = true
stamped_rank = 300
[comps.generation.cols]
through = { eid = "entry", death = "keep" }
provider = "text"
model = "text"
effort = "text"
[comps.generation.stamped]
serving_model = "text"
[[comps.generation.indexes]]
cols = ["through"]
unique = true

[comps.output]
rank = 340
log = true
[comps.output.cols]
source = { eid = "generation", death = "keep" }
key = "text"
phase = "text"
[[comps.output.indexes]]
cols = ["source", "key"]
unique = true
where = "key is not null"

[comps.call]
rank = 350
log = true
[comps.call.cols]
key = "text"

[comps.bash]
rank = 360
log = true
[comps.bash.cols]
command = "body"
cwd = "text"

[comps.fetch]
rank = 370
log = true
[comps.fetch.cols]
url = "url"
method = { enum = "httpMethods" }

[comps.patch]
rank = 380
log = true
[comps.patch.cols]
path = "text"
diff = "body"

# Provider-neutral named-tool facet (D-16704): an imported tool call with
# no first-class facet keeps its real `name` and a one-line arg `detail`,
# so entry_log renders it through the ordinary call path. Wire-writable —
# an importer names the tool.
[comps.tool]
rank = 390
log = true
[comps.tool.cols]
name = "text"
detail = "text"

[comps.task_context]
rank = 400
log = true

[comps.graph_query]
rank = 410
log = true
[comps.graph_query.cols]
query = "query"

# A graph Change[] batch, serialized. One mutation facet preserves the
# graph's existing vocabulary, and holding the whole array keeps the hosted
# apply atomic — two dependent patches ride one write (T-16716).
[comps.apply]
rank = 420
log = true
[comps.apply.cols]
changes = "body"

[comps.result]
rank = 430
log = true
[comps.result.cols]
call = { eid = "call", death = "keep" }
[[comps.result.indexes]]
cols = ["call"]
unique = true

[comps.exit]
rank = 440
log = true
[comps.exit.cols]
code = "number"

[comps.response]
rank = 450
log = true
[comps.response.cols]
status = "number"

[comps.headers]
rank = 460
log = true
[comps.headers.cols]
data = "body"

[comps.stderr]
rank = 470
log = true
[comps.stderr.cols]
text = "body"

[comps.timeout]
rank = 480
log = true
[comps.timeout.cols]
ms = "number"

[comps.checkpoint]
rank = 490
log = true
[comps.checkpoint.cols]
through = { eid = "entry", death = "keep" }

[comps.cancel]
rank = 500
log = true
[comps.cancel.cols]
target = { eid = "entity", death = "keep" }

[comps.reasoning]
rank = 510
log = true

# Memory auto-recall (T-17306): a recall-floater entry — the memories the
# graph surfaced for the message named by `source`. It carries no `message`
# facet, so the recall effect (which fires on message) never fires on a
# recall entry: recall cannot recall itself.
[comps.recalled]
rank = 520
log = true
[comps.recalled.cols]
source = { eid = "entry", death = "keep" }

# Same-provider replay evidence only: encrypted reasoning and provider
# shapes the typed vocabulary does not yet know.
[comps.opaque]
rank = 530
log = true
[comps.opaque.cols]
format = "text"
data = "body"

[comps.runner]
rank = 540
log = true
kind_rank = 170
[comps.runner.cols]
name = "text"

# Whole components are server-owned (empty writable half).
[comps.lease]
rank = 550
log = true
stamped_rank = 320
[comps.lease.stamped]
holder = { eid = "runner", death = "keep" }
at = "time"
until = "time"

[comps.usage]
rank = 560
log = true
stamped_rank = 330
[comps.usage.stamped]
input = "number"
cached = "number"
output = "number"
reasoning = "number"

# The ingest coordinate (D-16704): where an imported entry came from.
# Server-owned like lease/usage: the trusted append path stamps it in the
# same transaction as the entry, so no client can pre-stamp a coordinate to
# make the ingester skip a real line. The set of (session, source, line)
# present IS the durable cursor. `line` is the SOURCE line, not entry.seq.
[comps.imported]
rank = 570
log = true
stamped_rank = 310
[comps.imported.stamped]
source = "text"
line = "number"

# --- launch + leases -------------------------------------------------------

# One launch vocabulary, worn two ways: on a session it records the request
# that launched it; on a task it is the hint for its next run. Partial on
# purpose — doors fill the gaps from their caller and the provider table.
# apply() mirrors session facets into the legacy aliases; a task facet
# stays spawn-only.
[comps.spawn]
rank = 580
[comps.spawn.cols]
provider = "text"
model = "text"
effort = "text"
persona = { eid = "entity", death = "detach" }

# 'release' is the claim's word exactly: when the session dies the LEASE
# vanishes (row deleted, claim-null on the wire) but the claimed entity —
# somebody's task — survives, freed. claimed_at server-stamped.
[comps.claim]
rank = 590
kind_rank = 180
stamped_rank = 130
[comps.claim.cols]
session = { eid = "session", death = "release" }
[comps.claim.stamped]
claimed_at = "time"

# An operator's interrupted work stack is server-owned. Claim release
# pushes; another claim or a settled task pops.
[comps.resume]
rank = 600
stamped_rank = 140
[comps.resume.stamped]
actor = { eid = "entity", death = "keep" }
at = "time"
rank = "number"

# The selected conversational session for one actor looking at one entity.
# The session wears this facet; replacing the chat moves the facet to a new
# session while the old transcript remains durable history.
[comps.chat]
rank = 620
[comps.chat.cols]
actor = { eid = "entity", death = "detach" }
target = { eid = "entity", death = "detach" }
[[comps.chat.indexes]]
cols = ["actor", "target"]
unique = true

# The brake, pulled as data: creating one asks the server to stop the
# session it targets. Valid only against an ACTIVE managed session (apply()
# refuses the rest); the row stays as audit, like conflict, and wears
# `delivered` once the signals are sent (deliver.ts).
[comps.stop_request]
rank = 630
kind_rank = 200
[comps.stop_request.cols]
target = { eid = "session", death = "cascade" }
