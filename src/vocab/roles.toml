# The roles plugin (D-22530 §8): persistent fleet capacity (roles.ts), the
# dream consolidation cursor (dream.ts), and self-healing's diagnosis
# vocabulary (heal.ts).

name = "roles"

# A role is desired capacity. `held` is the crash-loop breaker's verdict —
# the reconciler stopped relaunching a burning role and waits for an owner
# `task role start`. Distinct from `stopped` (an owner's off switch) so the
# two read apart and `held` keeps its error component across every tick.
[enums.roleStates]
rank = 50
values = ["running", "stopped", "paused", "disabled", "retired", "held"]

# Native owns an interactive provider TUI; managed owns a resumable Tasks
# session.
[enums.roleSurfaces]
rank = 60
values = ["native", "managed"]

[enums.wakePolicies]
rank = 70
values = ["always", "attention", "scheduled", "manual"]

[comps.role]
rank = 60
kind_rank = 140
prefix = "R"
by_name = true
stamped_rank = 250
[comps.role.cols]
state = { enum = "roleStates" }
surface = { enum = "roleSurfaces" }
# Scope is attachment, not execution ground: a role may serve any graph
# entity. checkout names the repo-bearing entity when scope is not one.
scope = { eid = "entity", death = "detach" }
checkout = { eid = "entity", death = "detach" }
schedule = "text"
wake_policy = { enum = "wakePolicies" }
wake_target = { eid = "entity", death = "detach" }
# The crash-loop breaker's fresh-start boundary: `task role start` stamps
# it, and the breaker counts only deaths after it (roles.ts). The
# reconciler never writes it, so a successful launch can't wipe the fence.
retry_at = "time"
# System-role throttling as graph data (D-18722 part C): quiet is how long
# a trigger item must sit untouched before it counts, cooldown the minimum
# gap between run starts. SECONDS, the wake vocabulary. The values are
# data; enforcement stays in the role's registered handler (roles.ts).
quiet = "number"
cooldown = "number"
# A concurrency ceiling for system roles whose work spawns (the fixer's
# hard cap, T-18729). A COUNT, not seconds — absent falls back to the
# handler's code default, like quiet/cooldown.
cap = "number"
[comps.role.stamped]
applied_hash = "text"
applied_at = "time"
stopped_at = "time"
decision = "text"
reason = "text"
observed = { eid = "entity", death = "keep" }
decided_at = "time"

# A dream: a venture's consolidation cursor (T-12800, D-17362). One per
# venture, its own entity rather than a mark on the project, so its cadence
# clock (a self-armed wake) and its cursor are the venture's alone. `scope`
# names the venture project the comb consolidates; `floor` is the sliding
# cursor over sessions finished since, advanced one calendar day per run
# and clamped to a max(20 entries, 7 days) window (dream.ts). A distinct
# kind, so `graph_query kind=dream` lists them.
[comps.dream]
rank = 660
kind_rank = 230
prefix = "Z" # Z for sleep — the venture's consolidation cursor
[comps.dream.cols]
scope = { eid = "project", death = "cascade" }
floor = "time"

# Self-healing's diagnosis facet (D-17077): a task wearing `bug` was
# auto-filed about an `exception` somewhere in the graph. `fault` is the
# stable dedup key (kind + normalized message + stack head) so a storm of
# the same break finds its one open ticket by query, not scan; `hits`/`last`
# tally recurrences in place. Column names are unique on purpose —
# dot-param routing keys on them (a plain `count`/`key` would collide with
# recall/call). Wire-writable — heal.ts populates it through apply(), and
# forging a bug tally harms nobody. NOT in kindOrder: a bug IS a task.
[comps.bug]
rank = 930
[comps.bug.cols]
fault = "text"
hits = "number"
last = "time"

# The dream's dedup marker (T-17407), the consolidation twin of `bug`: an
# artifact the dream FILED wears it so the next run's 7-day re-comb finds
# the same drift already tracked and hit-counts instead of re-filing. `key`
# is the finding's stable shape (dream.ts findingKey); `hits`/`last` count
# recurrence. Rides on whatever the finding became — a consider TASK or a
# MEMORY — so one keyed lookup dedups across both. NOT in kindOrder.
[comps.finding]
rank = 940
[comps.finding.cols]
key = "text"
hits = "number"
last = "time"

# Self-healing phase 2 (D-17077): `fixer` marks a session AUTO-spawned to
# fix a bug ticket — presence alone, the way `design` tags a doc. The cap
# counts active fixers and the cooldown reaches the fault it heals through
# the session's requested_task → bug.fault. NOT in kindOrder — a fixer IS
# a session; this only says the graph spawned it to heal.
[comps.fixer]
rank = 950

# The auto-spawn mute (D-17077): `nofix` on a PROJECT silences fixer spawns
# for that venture's bugs; on the self-healing HOME project (P-19) it is
# the GLOBAL switch. The break still files a ticket — this suppresses only
# the agent, and the boot sweep re-drives once it clears. A pure-presence
# marker a human sets/clears. NOT in kindOrder — a lever, not an identity.
[comps.nofix]
rank = 960
