# The store on Cloudflare (D-32318 §Storage): one Durable Object class whose
# SQLite is a graph store, one object per (space, app). Local workerd only for
# now — src/store/do_test.ts drives `wrangler dev` against this file; nothing
# deploys from here yet.
name = "yak-store"
main = "index.ts"
compatibility_date = "2025-05-08"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]
