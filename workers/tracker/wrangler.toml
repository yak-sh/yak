# Independent error intake, stores and delivery. No binding points to yak.
name = "yak-tracker"
main = "index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability.logs]
enabled = true
invocation_logs = true

[[durable_objects.bindings]]
name = "TRACKERS"
class_name = "Tracker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Tracker"]

[[queues.producers]]
binding = "ERRORS"
queue = "yak-errors"

[[queues.producers]]
binding = "REJECTED"
queue = "yak-errors-dead"

[[queues.consumers]]
queue = "yak-errors"
max_batch_size = 100
max_batch_timeout = 1
# A message whose intake failed waits two seconds, doubling to five minutes
# (queue.ts `wait`), so a hundred retries hold it through an outage of about
# eight hours before it is a dead letter. `retry_delay` is the wait of a retry
# that names none: a delivery the consumer threw on, or left past its hundred.
max_retries = 100
retry_delay = 30
# One Tracker object takes each scope's intake, a message at a time: more
# consumers at once only queue behind it until it answers "overloaded".
max_concurrency = 1
dead_letter_queue = "yak-errors-dead"

[[send_email]]
name = "MAIL"

# Letters go out through Resend on the RESEND_TOKEN secret; the MAIL binding
# above is what a deployment without MAIL_VIA sends on.
[vars]
MAIL_VIA = "resend"

[triggers]
crons = ["* * * * *"]

# Runtime secrets: TRACKER_SECRET (tracker-only signing key), MAIL_TO,
# MAIL_FROM, RESEND_TOKEN and RESEND_WEBHOOK_SECRET. T-59075 supplies the queue
# and Workers Builds connection.
