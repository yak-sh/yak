# Independent error intake, stores and delivery. No binding points to yak.
name = "yak-tracker"
main = "index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability.logs]
enabled = true
invocation_logs = true

[[durable_objects.bindings]]
name = "TRACKERS"
class_name = "Tracker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Tracker"]

[[queues.producers]]
binding = "ERRORS"
queue = "yak-errors"

[[queues.producers]]
binding = "REJECTED"
queue = "yak-errors-dead"

[[queues.consumers]]
queue = "yak-errors"
max_batch_size = 100
max_batch_timeout = 1
max_retries = 10
dead_letter_queue = "yak-errors-dead"

[[send_email]]
name = "MAIL"

# Letters go out through Resend on the RESEND_TOKEN secret; the MAIL binding
# above is what a deployment without MAIL_VIA sends on.
[vars]
MAIL_VIA = "resend"

[triggers]
crons = ["* * * * *"]

# Runtime secrets: TRACKER_SECRET (tracker-only signing key), MAIL_TO,
# MAIL_FROM, RESEND_TOKEN and RESEND_WEBHOOK_SECRET. T-59075 supplies the queue
# and Workers Builds connection.
