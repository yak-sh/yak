# yak-browser renders a draft for app_preview (../browser.ts): puppeteer drives
# Cloudflare's browser to the draft's private address, takes its screenshot,
# console, errors and status, and runs axe-core's accessibility check in the
# page (capture.ts). Its own Worker because puppeteer, and axe-core's bundle,
# are code compiled when an isolate starts: in the kernel that would be every
# isolate, a Store waking for one query included. Here it is only the isolates
# that render.
#
# No routes and no secrets, and BROWSER its one binding: the kernel's BROWSER
# service binding is the one way in, and Cloudflare's browser the one way out.
# A failure is answered, never reported here; the kernel reports it. The
# kernel's deploy deploys it first, to the same environment (../wrangler.ts
# `siblings`).
name = "yak-browser"
main = "index.ts"
account_id = "0f9613dfd3f0451df0bd0f12a1372ea3"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
minify = true

[observability.logs]
enabled = true
invocation_logs = true

[browser]
binding = "BROWSER"

[env.staging]
name = "yak-browser-staging"
workers_dev = false
preview_urls = false

[env.staging.browser]
binding = "BROWSER"

[env.staging.observability.logs]
enabled = true
invocation_logs = true
