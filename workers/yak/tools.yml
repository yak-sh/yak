# The text of every platform tool: one entry per tool name, holding the title
# a person reads in a permission prompt and the description an agent reads to
# decide whether to call it. The tools themselves are defined in code
# (tools.ts, and a plugin's own file); each refers to this file by its name,
# and a name missing here fails at module load rather than serving a tool
# with no description.
#
# A description that depends on something this file cannot know keeps a named
# placeholder, `{{pages}}` in `guide` for example, which the code fills in when
# the tool is built.

space_new:
  title: Create a space
  description: >-
    Create another space, a group of apps sharing an address and membership,
    at <slug>.yaks.app, with the signed-in person as its owner. Signing in
    already gave them one; this makes a second. Pass a slug (the short name
    in the URL) and optionally a display title. Returns the space name,
    entity id and URL. Other tools infer the space when only one fits;
    specify space when more than one could match.
space_set:
  title: Rename or move a space
  description: >-
    Change a space's name or move it to another address. The title is its
    name; the slug is its address, so changing the slug moves the space to
    <new>.yaks.app. Every app in it moves with it, files and data included,
    and each app keeps its own path under the new address. The old address
    keeps working: it redirects to the new one, path included, so an
    existing link still opens the same page, and email to
    <old>.<app>@yaks.app still arrives. The old address also stays reserved:
    nobody else can take it, and neither can this space, until it is
    forgotten. Only the space owner may rename or move it. Pass forget with
    a slug the space has already left to drop it: it stops redirecting and
    anyone can take it, so every link and every email still aimed there
    finds nothing. Forgetting is final for that address. Returns the current
    address and a summary of the changes, including any old address
    released. Documentation: https://yaks.app/docs/home.
space_delete:
  title: Delete a space
  description: >-
    Delete a space: it goes to the trash for 30 days. Every app in it stops
    answering, its address stops serving and its apps disappear from your
    tools, but nothing is erased, the address is held, and space_restore
    brings the whole space back within those 30 days. After that the
    platform erases it: the apps, everything they saved, their files, any
    domain attached to them, and the address becomes available again. This
    tool cannot delete the space itself: it emails the space's owner a
    confirmation link, valid for one hour, and returns a summary of what
    that link would stop. The confirmation is the owner's to give by opening
    that link; nothing else completes the deletion. Only the space owner may
    ask. app_delete trashes one app instead. With forever: true the link
    erases the space at once instead, with nothing kept and no undo. To undo
    a delete: space_restore, any time in those 30 days. Documentation:
    https://yaks.app/docs/errors.
space_restore:
  title: Restore a deleted space
  description: >-
    Bring back a space that was deleted. Every app in it serves again at the
    address it always had, its tools and pages come back, and everything it
    saved is exactly as it was; nothing is touched while a space sits in the
    trash. Works within 30 days of the delete being confirmed; after that
    the space has been erased and there is nothing to bring back. Unlike
    space_delete, restoring needs no confirmation email. The caller must
    still be the space owner. Pass the deleted space's slug; returns its
    restored URL. Documentation: https://yaks.app/docs/errors.
space_sell:
  title: Connect Stripe to a space
  description: >-
    Connect this space to Stripe so its apps can take payments. Requires the
    Plus plan and the space owner. The tool returns a link where the person
    finishes setting up with Stripe (their name, their bank account,
    whatever Stripe asks); all of that happens at Stripe, and yaks.app never
    sees or holds any of it. They are the merchant: the charge, the money,
    the name on the customer's statement, and any refunds and disputes are
    theirs. Nobody can sell until the person has finished at Stripe, and
    calling again returns a fresh link to the same Stripe account, never a
    second account. If setup is already complete, it returns the payment
    readiness and platform fee instead of a link. Once they are done, every
    app in the space can take payments through POST /api/pay/checkout. Pass
    disconnect: true to stop selling through this space; their Stripe
    account and everything in it stays theirs, this space just stops
    charging on it. Disconnecting returns a confirmation that this space can
    no longer charge through the account. Documentation:
    https://yaks.app/docs/selling.
app_new:
  title: Create an app
  description: >-
    Create a new app, served at <space>.yaks.app/<slug>/. Pass its slug and
    optionally a display title. Creating it does not choose a front page for
    the space; the owner can do that with app_set(home: true). app_files
    writes its files and app_deploy releases a version. Pass access when the
    app is for other people too: 'open' if anyone with the link should be
    able to write to it (vote, add a line, sign up), and 'private' if only
    the person and whoever they invite (member_add) should see it at all.
    The default access is 'public': anyone can read, but only members
    allowed to write can change data. Returns the app's entity id, URL and
    access setting. Documentation: https://yaks.app/docs.
app_files:
  title: Read or write app files
  description: >-
    Write the app's files (index.html and any css, js or images beside it),
    or list them, read one back, or delete one. Write a whole app in one
    call with files: [{path, content}, …]; passing a files list is the
    write, so leave op out. path and content write a single file, and base64
    in place of content writes a file that is not text, such as an image or
    the .wasm a worker.js imports. Files are served live at
    <space>.yaks.app/<app>/<path>, and index.html serves the directory. An
    app's data lives in its own store, never localStorage: a page reads and
    writes it with `import { apply, query, search } from './api/client.js'`,
    served beside the app. Each page gets a `<base>` at the app's own
    address, so relative URLs resolve there and a copy installed at another
    address still works.
    Every write returns what it stored: the byte count and SHA-256 content
    hash, and for a .json file whether it parses, with the position of the
    error when it does not, so a miscounted bracket is caught in the call
    that made it. NOTES.md beside index.html holds the app's own notes (how
    the app is maintained, in the person's words, up to 4 KB), and the about
    tool returns them. Like vocab.json, it is internal to the app: never
    served on the web, only read back here. op: patch with path, find and
    replace edits one file in place; find is an exact string and must occur
    exactly once. op: fetch with path and url downloads an https response
    body to path, which is how a library is vendored without transcribing
    it, and returns an integrity hash for it. Nothing a write or a delete
    replaces is lost: the previous bytes are kept for 30 days. op: history
    with path lists them newest first (sha256, size, when it was replaced
    and by whom), and op: restore with path puts one back, the newest by
    default or the one sha or at names. A restore is itself a write, so it
    too can be undone. To undo any write, patch, fetch or delete here: op:
    history, then op: restore. Pass op explicitly unless supplying files,
    content or base64 for a write. list returns file paths, read returns
    file text, and delete confirms the path removed. Documentation:
    https://yaks.app/docs/files.
sandbox_shell:
  title: Run a build command
  description: >-
    Run one command in this space's build sandbox, a Linux container for
    what a browser cannot do on its own: compile something to WebAssembly,
    run a generator, minify an asset. Installed: Rust 1.98.1 with the
    wasm32-unknown-unknown target, wasm-bindgen 0.2.128 and wasm-opt 132;
    Python 3.13.15 with pip; Go 1.27.1; Zig 0.16.0, which is also the C and
    C++ compiler here (`zig cc -target wasm32-freestanding -nostdlib
    -Wl,--no-entry` produces a module a browser loads with no glue code, and
    -target wasm32-wasi one that a WebAssembly System Interface (WASI)
    compatibility layer runs); Deno 2.9.1, and the Node and Bun the base
    image ships. Anything else can be installed for the duration of the
    build: the command runs as root, so `apt-get install -y <pkg>`, cargo,
    pip, npm and go get work, and it costs the next build nothing. Its
    network reaches the package registries and this platform and nothing
    else. sandbox_write
    writes source into it, and sandbox_ship copies a built artifact into the
    app. An app needs none of this unless something must be compiled: html,
    css and js run as they are. The sandbox is signed in as the person:
    `yak` is installed and $YAKS_TOKEN and $YAKS_HOST are set, so `yak
    <tool>` and curl can call these same tools from inside a script, and the
    token is short-lived and revoked when the platform destroys the
    container. Sandbox use is metered in seconds charged to the space, with
    a {{budget}}-second budget per managed build (or per standalone tool
    call) and a monthly allowance shared by the free spaces its owner has.
    One person has one sandbox awake at a time on the free tier, two on the
    Plus plan. The container is destroyed when the build ends; separate MCP
    calls reuse it until it sleeps after five idle minutes. Its files are
    temporary. A command that ends within timeout milliseconds returns its
    exit code and its last 40 lines of output, stdout then stderr, cut after
    8,000 characters. One still running then keeps running, for at most 240
    seconds, and the answer gives its process id for sandbox_wait and
    sandbox_stop. A command can call these tools and change apps, so its
    external effects are not undone by discarding the container.
    Documentation: https://yaks.app/docs/code.
sandbox_wait:
  title: Wait for a build command
  description: >-
    Wait for a command sandbox_shell left running in this space's build
    sandbox, by the process id its answer gave. Returns the exit code and the
    last 40 lines of output, stdout then stderr, or says it is still running
    when timeout milliseconds pass (default 60000). Waiting keeps the sandbox
    awake, metered by the second as with sandbox_shell. Documentation:
    https://yaks.app/docs/code.
sandbox_stop:
  title: Stop a build command
  description: >-
    Stop a command sandbox_shell left running in this space's build sandbox,
    by the process id its answer gave, and return its exit code. Waking the
    sandbox is metered by the second, as with sandbox_shell. Nothing to undo:
    what it already wrote to the sandbox stays, and sandbox_shell runs it
    again. Documentation: https://yaks.app/docs/code.
sandbox_write:
  title: Write a build file
  description: >-
    Write one file inside this space's build sandbox: a Cargo.toml, a
    src/lib.rs, whatever the build needs. These are not the app's files:
    nothing here is served, and files are temporary, not durable app
    storage. app_files writes what the app serves; sandbox_ship copies a
    built artifact from the sandbox into the app. Waking the sandbox is
    metered by the second, as with sandbox_shell. Pass a sandbox path and
    nonempty text; this overwrites that path without file history and
    returns the path written. Nothing to undo: nothing of the app lives
    here, and only sandbox_ship copies build output into durable app files.
    Documentation: https://yaks.app/docs/code.
sandbox_read:
  title: Read a build file
  description: >-
    Read one file out of this space's build sandbox: a generated source, a
    build log, whatever the last command left behind. Waking the sandbox is
    metered by the second, as with sandbox_shell. Pass a path relative to
    /workspace. Returns file text, truncated after 8,000 characters;
    sandbox_shell can inspect a large or binary file with a command.
    Documentation: https://yaks.app/docs/code.
sandbox_ship:
  title: Copy build output into the app
  description: >-
    Copy what the build produced into the app, where it is served: name the
    files in the sandbox (pkg/*.wasm, pkg/*.js) and each is written beside
    index.html under its own filename, as if app_files had written it. The
    app keeps the artifact independently of the temporary sandbox. This call
    does not itself destroy the sandbox. Binary files are copied as bytes,
    so a .wasm arrives intact. Waking the sandbox is metered by the second,
    as with sandbox_shell. To undo: these are written through app_files, so
    each keeps the bytes it replaced; use app_files op: history, then op:
    restore. Pass paths as a list of file paths or wildcard patterns (globs)
    relative to /workspace. Returns the copied filenames, file count and app
    URL. Documentation: https://yaks.app/docs/code.
app_deploy:
  title: Release a version
  description: >-
    Release the app's files as a version. The files are already live, so
    this marks them as one version, the one an error report will name. It
    also creates the components the app's vocab.json declares ({{vocab}}). A
    component is a named group of typed fields attached to a stored record,
    called an entity; vocab.json is the schema defining those groups and
    fields. A component name the platform already uses is refused, and the
    whole manifest is refused with it before anything is created; a
    component or a property this manifest no longer names, and that holds
    nothing, is dropped. It reports the properties it added and the
    properties the store still has values under that this manifest did not
    name: a property is never renamed or retyped, so a new name is added
    beside the old one, which keeps every row already written under it until
    those values move. A seed.json beside index.html (a list of
    bundles, each a JSON object holding an entity id and its components, or
    a seed/ folder of *.json files when there are many) is written into the
    app's store here, once per store and after the components, so the app
    opens with data in it; deploying again seeds nothing. A $defs entry of
    vocab.json marked "tool": true gives the app a command of its own
    ({{tools}}), which
    everyone who can reach the app runs with the command tool, so the person
    and their agent act on the app through its own commands. A worker.js
    beside index.html becomes the app's own server code: it handles every
    request that is not under /api/ before the files do, and whatever it
    answers 404 falls through to the files. Every deploy is kept, so
    app_rollback can put this one back later. If the app is published, the
    published version does not move with it: what strangers install stays
    the version you published until you call app_publish again, and this
    tool says so when the published version starts falling behind. To undo:
    app_rollback, which puts an earlier deploy back as a new version. Pass
    the app slug. Returns the new version, URL, and any schema, seed,
    command or worker deployment details. Documentation:
    https://yaks.app/docs.
store_load:
  title: Load a data file into the store
  description: >-
    Write a data file the app already contains into the app's store, now.
    path is one file (data/cities.json) or a folder, in which case every
    *.json and *.csv under it is loaded. A JSON file holds a list of
    bundles: JSON objects containing a record (entity) id and named groups
    of fields (components), as seed.json and graph_apply accept: [{"entity":
    {"eid": "$a"}, "doc": {"title": "…"}}]. A CSV is a spreadsheet, and `as`
    names the component one row becomes: as: "city" with headers
    name,country writes city{name, country} per row, values converted to the
    property types the app's vocab.json schema declares. `title` and `body`
    columns go into the row's doc component; an `id` (or `alias`) column is
    the row's name, stored as alias{name}, which resolves to the entity
    already holding that name, so loading the file again patches those rows
    instead of duplicating them, and the name can be used anywhere an entity
    id (eid) can. map {"Serves how many": "serves"} renames a header that
    does not match a property. A header that matches no property is refused,
    as is a cell that will not convert, and the error names the row and the
    header. All the files are loaded in one transaction, read in filename
    order, so an alias created in one file resolves in the next; if the
    store refuses a bundle nothing is written and the refusal names the file
    and the entry that caused it. A large dataset gets in without being
    typed into a call: app_files op: fetch downloads the file into the app,
    and store_load writes it into the store. Unlike a seed it is not
    once-only: each call patches and adds as the caller, so the rows carry
    the caller's attribution. It applies whatever the file contains, deletes
    included: a bundle with $delete: true (or tombstone: {}) deletes that
    entity, and the store's access rules decide whether the caller may. A
    bundle naming an eid patches that row; one naming a $alias creates a new
    entity each run, unless it carries alias: {name: "…"}, which resolves to
    the entity already holding that name, so a file loaded twice is a patch
    and not a second copy. Returns the number of entities written and the
    source filenames (or a file count when more than six files were loaded).
    To undo: store_restore, to a moment just before the load. Documentation:
    https://yaks.app/docs/store.
app_versions:
  title: List app versions
  description: >-
    List the newest 20 deploys of the named app, newest first, with when
    each went out and which files changed. It is the list a version is named
    from for app_rollback. All deploys are kept; the response reports the
    total, and an older version can still be rolled back to by number.
    Documentation: https://yaks.app/docs/errors.
app_rollback:
  title: Roll back to an earlier version
  description: >-
    Put the app back to an earlier deploy: every file of that deploy, its
    components, its tools and its worker code with them. For a change that
    broke something, or the old version back. It goes out as a new version,
    so nothing is lost and a rollback can itself be rolled back. Leave
    version out for the deploy before the live one, or name one from
    app_versions. Existing data rows are not restored or deleted: files are
    restored and their schema is reapplied using the same additive rules as
    app_deploy. To undo: another app_rollback, since this goes out as a new
    version and app_versions still lists the one you left. Returns the
    source version, new version, URL and deployment details. Documentation:
    https://yaks.app/docs/errors.
store_restore:
  title: Restore the store to a point in time
  description: >-
    Put everything the app has saved back to how it was at a moment: the
    whole store, every row of it, as of that time. For a write that went
    wrong: a bad import, rows deleted by mistake, a change that turned out
    to be wrong. Cloudflare keeps the last 30 days of the store, so any
    moment in those 30 days can be restored; at is that moment, as a
    timestamp (2026-09-06T14:20:00Z). Called with no at, it reports the
    oldest moment still available and every restore already made. It is
    reversible: where the store stood before is recorded before anything
    moves, so a restore is undone by restoring again to a moment just before
    it, and the response names that moment. Everything written since the
    named moment is lost, so the latest moment that will do costs the least.
    The app is briefly restarted to pick up the restored store. The app's
    files are not part of this; app_rollback and app_files op: restore put
    those back. To undo: another store_restore, to the moment just before
    this one, which the response names. Documentation:
    https://yaks.app/docs/files.
app_set:
  title: Rename, move or reshare an app
  description: >-
    Rename an app, move it to another address, or change who may use it. The
    title is its name; the slug is its address, so changing the slug moves
    the app to <space>.yaks.app/<new>/. Its files and everything it has
    saved move with it, and the old address redirects to the new one, so an
    existing link still works. access is the same choice app_new offers:
    'open' when they want everyone with the link to be able to write to the
    app, 'private' to close it to everyone but its members. home makes this
    app the space's front page: what <space>.yaks.app/ opens, the app
    someone lands on when given the space address itself. No app becomes the
    front page just by being created. home: false removes this app as the
    front page if it currently is one; it does not unset another app. With
    no front page, the space address lists apps the visitor can open. Only
    the space owner may change it. first is the front page's own routing:
    the paths its worker.js handles before the app whose name owns them, as
    globs; ["/recipes/*"] sends every address under /recipes/ to the front
    page instead of the recipes app. It matters only when the front page is
    meant to route the whole space; an empty list puts every path back where
    it was. gallery is whether a published app is submitted for
    https://yaks.app/gallery, the public page of yaks apps: true submits it,
    false withdraws it at once. Pass forget with a slug this app has already
    left to drop it: it stops redirecting and another app can be created
    there, so every link still aimed at it finds nothing. Only the space
    owner may do that, and it is final for that address. sandboxed is for an
    app installed from someone else's release, which runs like the space's
    own apps: true runs it in a browser origin of its own, where it reaches
    only its own data and the platform supplies its localStorage; false lets
    it out again. Only the space owner may set it. The default access,
    'public', allows anyone to read and only members with write permission
    to change data. Returns the current URL and a summary of the changes.
    Documentation: https://yaks.app/docs/home.
connection_need:
  title: Say an app needs a key or a sign-in
  description: >-
    Say that an app's worker calls an outside service with a key or a
    sign-in (an API key, a Google account): it makes a connection for the
    person to connect on the space's connections page, and no key ever
    passes through this tool or this chat. Name a built integration, or any
    name of your own with the hosts its key may be sent to
    (integration: 'weather', hosts: ['api.weatherapi.com']). worker.js reads
    it as env.NAME (binding; default the name in capitals), and puts it
    wherever the service wants its key, a header, the query or the body:
    `fetch('https://api.weatherapi.com/v1/current.json?key=' +
    env.WEATHER)`. What it holds is a sentinel, which yaks.app swaps for the
    key on the way out, only to those hosts; direct: true hands it the key
    itself instead, for a key it must sign with. Until the person connects
    it, env.NAME is not there. Asking again renames or changes it. With
    each: true, every person who uses the app connects their own account
    instead, at the app's own /api/connections/<integration>, and only they
    call out through it; the page reads theirs from ./api/env. Returns the
    name worker.js reads and the page the person connects it at.
    Documentation: https://yaks.app/docs/code.
connection_list:
  title: List connections
  description: >-
    The space's connections to outside services: each one's service, whether
    it is connected, and which apps use it by which env.NAME. A key is never
    shown, by this tool or any other. Use it before connection_need to see
    what the person has already connected. Documentation:
    https://yaks.app/docs/code.
app_delete:
  title: Delete an app
  description: >-
    Delete an app: it goes to the trash for 30 days. Its address stops
    answering, its tools and pages disappear from your tools, and it stops
    being the front page, but its files, everything it saved and its slug
    are all kept, and app_restore brings the whole app back within those 30
    days. After that the platform erases it for good. app_files op: delete
    removes one file, and app_set moves an app rather than replacing it.
    forever: true skips the trash and erases it now; nothing is kept and
    there is no undo. To undo a delete: app_restore, any time in those 30
    days. Returns what was trashed or erased and, for a trash operation, how
    to restore it. Documentation: https://yaks.app/docs/errors.
app_restore:
  title: Restore a deleted app
  description: >-
    Bring back an app that was deleted. It serves again at the address it
    always had, its tools and pages come back, and everything it saved is
    exactly as it was; nothing is touched while an app sits in the trash.
    Works within 30 days of app_delete; after that it has been erased and
    there is nothing to bring back. app_list shows what is in the trash and
    how long each app has left. Pass the deleted app slug (and its space if
    needed to find it). Returns its restored URL and a confirmation.
    Documentation: https://yaks.app/docs/errors.
app_errors:
  title: List open errors
  description: >-
    List unarchived error reports for the named app: what a page threw in
    someone's browser, what a request threw on the server, and what the
    platform reported. Each is a stored record with its own id in the app's
    data store. New ones are also appended, once, to the next reply from a
    tool that changes something; a read-only tool leaves them unseen.
    `fixed` archives the ids it names, which removes them from this list and
    from replies; `seen` archives without listing every id: `all`, `v3` for
    everything up to and including that deploy, or a date. Returns any
    archive count followed by the remaining reports, or “no open errors”.
    Archiving a report does not fix the underlying problem. Documentation:
    https://yaks.app/docs/errors.
app_list:
  title: List the person's apps
  description: >-
    What the person already has here: every app in every space of theirs,
    with its address, the email address it sends and receives at, the
    version it is at, how many errors are still open in it, which app is the
    space's front page, and what the month has cost against what the space
    is allowed. Deleted apps are listed under Trash with the days each has
    left, until app_restore brings it back or the 30 days run out.
    Documentation: https://yaks.app/docs.
commands:
  title: List app commands
  description: >-
    The commands yaks apps declare, with the arguments each one accepts. An
    app's own commands (the ones its vocab.json declares, and the two every
    component it holds gets, such as add_recipe and find_recipe) are listed
    here rather than in this tool list, which is the same for everybody.
    command runs one of them. Omit app to list all reachable apps, or pass
    an app slug (space/app if ambiguous). The result groups commands by app
    and says whether each reads or writes. Documentation:
    https://yaks.app/docs/tools.
command:
  title: Run an app command
  description: >-
    Run one of an app's own commands: name it and pass its arguments as
    args, exactly as commands lists them. app is only needed when two apps
    here declare the same command name. The command runs through the app's
    ordinary API endpoints as the person calling it, so it can do what they
    could do on the page and never more. To undo whatever it wrote:
    store_restore, to the moment just before it ran. Returns the command
    result from the app. Its description in commands says what it does;
    restoring data cannot undo an external effect such as an email or
    payment. Documentation: https://yaks.app/docs/tools.
domain_attach:
  title: Attach a custom domain
  description: >-
    Serve a domain the person already owns, example.com instead of
    yourname.yaks.app. Name an app and that app answers at the root of the
    domain; leave app out and the whole space answers there, exactly as it
    does at <space>.yaks.app: the front page at /, every app at /<app>/. A
    space and each of its apps can have their own domain at the same time.
    The tool registers the hostname here and returns the DNS record the
    person has to add where their domain is managed, in the response text:
    type, name, value. Nothing serves until that record is in place at the
    registrar; domain_status reports when it has arrived. Only the space
    owner may attach one. Custom domains require Plus unless the space is
    exempt. If the space is not eligible, the tool returns the plan-settings
    URL, where paid plans are compared in the space settings, and returns no
    checkout link; signing in returns the person to that page. No hostname
    is registered until the space is eligible. Documentation:
    https://yaks.app/docs/domains.
domain_status:
  title: Check a domain
  description: >-
    How far a domain has come, and what it points at: the space, or one of
    its apps. Whether the DNS record has arrived, whether Cloudflare has
    accepted the hostname, and whether the certificate is issued, each
    reported specifically enough to tell the person what is still waiting on
    them. It is read from Cloudflare, not from what was last recorded here.
    Leave hostname out to check every domain in the space. After
    domain_attach, the record, the hostname and the certificate arrive over
    a few minutes; nothing needs doing in between. Documentation:
    https://yaks.app/docs/domains.
domain_detach:
  title: Detach a custom domain
  description: >-
    Stop serving at a domain, whether it served a space or one app. The
    hostname is released back to Cloudflare and what it served is untouched:
    it still answers at its <space>.yaks.app address, and its data and files
    are not involved. The person's DNS record is theirs to remove wherever
    their domain is managed; until they do, it points at nothing. Only the
    space owner may detach. To undo: domain_attach with the same hostname,
    which starts the certificate again. Returns the detached hostname, the
    original yaks.app URL and a reminder to remove the DNS record.
    Documentation: https://yaks.app/docs/domains.
app_publish:
  title: Publish an app for others to install
  description: >-
    Publish this app so anyone in any other space can install it by name.
    Someone else then calls app_install and gets their own copy: their own
    store, their own address, their own data from the first byte, pinned to
    the version you published; nothing is shared but the code. The name is
    platform-wide, so it is the app's slug unless that is taken, and a taken
    name is refused. Publishing again publishes whatever is deployed now
    under the name it already has; a name is claimed once, and only an
    explicit new name moves it, which leaves the old name resolving to
    nothing. Nobody who installed it moves to the new version until they
    call app_update. Only the space owner may publish. gallery: true also
    submits it to be shown on https://yaks.app/gallery, a public page of
    what people have made. That is separate from publishing. It is not
    listed at once; yaks.app reviews the submission and decides, and the app
    is published either way. Returns the published name and version, how to
    install it, and any gallery submission status. Documentation:
    https://yaks.app/docs/sharing.
app_unpublish:
  title: Unpublish an app
  description: >-
    Stop offering the app for install. It stays exactly as it is, and so
    does every copy anyone installed, since their data is theirs, but nobody
    new can install it, and the name is free again. It leaves the gallery at
    the same moment, if it was on it. Only the space owner may unpublish. To
    undo: app_publish, which publishes it again under the same name unless
    somebody else has taken it meanwhile. Returns a confirmation, including
    whether its gallery listing or submission was removed. Documentation:
    https://yaks.app/docs/sharing.
app_published:
  title: List published apps
  description: >-
    What other people have published here, newest first: the name to install
    by, what the app is, and which space it came from. app_install gives
    them their own copy of one, with their own data. Pass words to list only
    the apps whose name, title or description contain them; the match also
    includes the printed origin and version details. It needs no account: a
    published app is offered to everybody. The listing includes each source
    space and app slug, not a guarantee that the source app's own pages are
    public. Documentation: https://yaks.app/docs/sharing.
app_install:
  title: Install a published app
  description: >-
    Take an app somebody published (app_published lists them) and make the
    person their own copy of it: their own address, their own data store,
    their own everything from the first byte. Nothing is shared but the
    code, so what they save is theirs alone and the publisher never sees it.
    The copy is pinned to the version it was installed from; the publisher's
    next version does not arrive on its own, and app_update moves the copy
    forward while keeping their data. Pass the published name and optionally
    as for the new app slug. By default it uses the source app slug if free,
    otherwise the published name. The copy runs like the space's own apps,
    with the browser's own storage and access to everything in the space;
    the space owner's app_set(sandboxed: true) walls it off in a browser
    origin of its own. Returns the installed version, file count, new URL
    and deployment details. Documentation:
    https://yaks.app/docs/sharing.
app_update:
  title: Update an installed app
  description: >-
    Move an installed app to whatever version its publisher offers now. The
    person's data stays: every row they saved is theirs and is not touched.
    Only the code is replaced, so anything you wrote into the copy yourself
    is replaced too. A vocab.json schema that only added properties is
    applied to their store; one that would retype a property their rows
    were written under is refused, and nothing moves. It reports what
    changed. To undo: app_rollback, since the update goes out as a version
    like any other and app_versions lists the one before it. Documentation:
    https://yaks.app/docs/sharing.
member_add:
  title: Invite someone
  description: >-
    Invite someone by email address, so they can change what an app holds:
    an editor writes and a viewer only reads; a space owner may also invite.
    Name the app and that one app is all they get, its page and its data and
    nothing else in the space; this is how a player joins one game or a
    household opens one list without being given everything else you keep
    here. Leave the app out and they are added to the space, which reaches
    every app in it. Either way they are mailed an invitation, and nothing is
    theirs until they accept it with the one click in that letter, signed in
    with that address; until then the space is not in their reach. Pass a
    note and the person's own message goes at the
    top of that email, as written and quoted as theirs: a line or two saying
    what this is ("the potluck list for Saturday"), which is the difference
    between an invitation someone opens and one they wonder about. Pass
    their name if you know it and their apps will show it beside what they
    write, so nobody sees an address; they can set it themselves at their
    first sign-in. There is nothing for them to install and no account to
    create first. Only the space owner may invite. An app that everyone with
    the link may write to without signing in is access 'open' (app_set)
    rather than a membership. Inviting someone who has already accepted
    changes their role and sends nothing. Each invitation letter counts
    against the space's monthly emails, and one person may send 50 an hour.
    Returns the role and scope of access; the accept link goes only to the
    invited address, so there is no link to pass on. If email delivery fails,
    calling again later sends it. Documentation:
    https://yaks.app/docs/sharing.
member_remove:
  title: Remove someone
  description: >-
    Remove a membership, or withdraw an invitation not yet accepted: pass an
    app slug to revoke its app-specific invitation, or omit app to revoke
    space-wide membership. Independent app
    invitations and space-wide membership do not revoke each other. Either
    way the person keeps their sign-in. Only the space owner may remove, and
    the last owner cannot be removed, since a space with no owner is one
    nobody can ever open again. To undo: member_add with the same address,
    which puts them back where they were. Returns a removal confirmation.
    App-specific removal revokes an app invitation, not access inherited
    from space membership. Documentation: https://yaks.app/docs/sharing.
grant:
  title: Create a CLI token
  description: >-
    A short-lived token that signs the `yak` CLI in as this person: the same
    identity and exactly the same access they have here, never more. For
    working from a terminal, or a script that reaches their apps; the
    response is the one line to paste. It lasts an hour unless `hours` says
    otherwise (24 at most), and `space` limits it to one space, which is the
    right choice when the token is going somewhere less safe than their
    laptop. The token is shown once, in the response, and stored nowhere it
    can be read back. `revoke` cancels a token before it expires, by the id
    the response that created it named. This tool requires a browser or
    connector sign-in; a CLI token cannot create or revoke tokens through
    it. Documentation: https://yaks.app/docs/sharing.
feedback:
  title: Send feedback about yaks.app
  description: >-
    Send feedback about yaks.app itself: this connector, its tools, its
    documentation, the way an app is built or served. A bug, a rough edge, a
    step that took three tries, a confusing answer, a wish, a feature idea,
    a thing that went well. Not for the app being built for the person: an
    error inside their own app is listed by app_errors. A report carries
    what the person said, in their words, and what was tried and what
    happened; who they are, their space, the app if named, and the versions
    are attached automatically. It reaches a person by email, and they can
    write back. It works signed out too: the report then records that it
    came from someone signed out, and there is no address to reply to unless
    one is in the text. Pass text describing the feedback, with optional
    space and app slugs. Returns a submission confirmation, or says the
    report was saved but could not be emailed. Documentation:
    https://yaks.app/docs/errors.
guide:
  title: Read the guide
  description: >-
    The guide, read here instead of fetched from the web. With no page: the
    overview, which says what an app is, how its pages read and write its
    store, and has a paragraph on every feature there is. It is the map.
    With a page: the whole of one subject. The pages are {{pages}}. A name
    that is none of them returns the overview, which lists them all. The
    same pages are served to a person at https://yaks.app/docs.md, and as
    web pages at https://yaks.app/docs.
about:
  title: What yaks.app is
  description: >-
    What yaks.app is and what gets made here, in a paragraph: what works
    signed out, what signing in adds, and where to sign in. Signed in, it
    also reports who you are signed in as, how (a browser, a connector, a
    CLI token) and until when, the tools this connector is listing right
    now, and every app you can reach: its address, what it holds, the notes
    it keeps and whatever the person has said in that space. Signed out it
    reads nothing about anybody: the same answer for everyone.
gallery_search:
  title: Search the gallery
  description: >-
    Find an app somebody has already made and shown at
    https://yaks.app/gallery: a recipe box, a sign-up sheet, a tracker. Pass
    the words the person used. Each result includes the command that gives
    them their own copy of it, at their own address with their own data. It
    works signed out too: the gallery is public. Documentation:
    https://yaks.app/docs/sharing.
memory_save:
  title: Save a memory
  description: >-
    Save a memory for the space: a sentence or a note kept for everyone
    working there and found again by what it is about. A person's own words
    are kept as they said them, so a preference, a standard or a way of
    working ("use grams, never cups", "keep it soft, not technical") comes
    back exactly; a note of the assistant's own, how or why something was
    built, is kept the same way. context is a line or two saying what was
    being talked about. It is kept for the whole space, and the about tool
    returns the newest few to any agent that asks. What is only about one
    app can also live in that app's NOTES.md (https://yaks.app/docs/notes),
    and a longer document in the app's store as a doc entity, which search
    finds. Pass said and optional context. Returns the saved words and
    context as confirmation. Documentation: https://yaks.app/docs/memory.
memory_recall:
  title: Recall memories
  description: >-
    The memories kept for the space, ranked against the words passed: what
    the person has said about how they want things done, and notes saved
    beside them. The newest few arrive with every connection already; this
    finds the rest. Returns each memory whole, with the context saved beside
    it. Documentation: https://yaks.app/docs/memory.
app_stats:
  title: App traffic
  description: >-
    Return page-view counts for an app: the total over the last 30 days by
    default, and counts by page, referring site and country. These count
    page loads, not distinct people. Pass days for a different window, up to
    90 days; if analytics is not configured, returns that fact instead.
    Aggregate counts and nothing else: no visitor is identified, no address
    and no session is kept, so this can never say who someone was or what
    one person did. Only the app's own members may ask. Documentation:
    https://yaks.app/docs/stats.
# The names the Claude connector directory listed that no tool above carries
# any more, answered until the next listing (published.ts).
sandbox_exec:
  title: Run a build command (listed name)
  description: >-
    The name sandbox_shell was listed under: run cmd in this space's build
    sandbox, in cwd (default /workspace), for at most timeout seconds
    (default and maximum 240). Returns the exit code and the last lines the
    command printed. New work calls sandbox_shell, which can also leave a
    long command running. Documentation: https://yaks.app/docs/code.
app_secret_set:
  title: Set a worker secret
  description: >-
    Give the app's worker a key it reads as env.NAME. The value becomes a
    connection the app uses directly (connection_list shows it), kept in the
    vault, and no tool reads it back. Setting a name again replaces its
    value. New work uses connection_need, where the person pastes the key on
    their connections page rather than in this chat. Returns the name and a
    confirmation, never the value. Documentation: https://yaks.app/docs/code.
app_secret_list:
  title: List worker secrets
  description: >-
    The names the app's worker reads as env.NAME from a connected key.
    Values are never returned, by this tool or any other. connection_list
    says the same with each connection's service and status. Documentation:
    https://yaks.app/docs/code.
app_secret_remove:
  title: Remove a worker secret
  description: >-
    Stop the app's worker reading env.NAME. A key handed to the worker
    itself, as app_secret_set hands one, is forgotten once no other app
    reads it, and nothing can restore it: to undo, set it again with the
    value. Any other connection stays on the person's connections page. Pass
    the name, not its value. Returns a removal confirmation. Documentation:
    https://yaks.app/docs/code.
