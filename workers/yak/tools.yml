# The text of every platform tool: one entry per tool name, holding the title
# a person reads in a permission prompt and the description an agent reads to
# decide whether to call it. The tools themselves are defined in code
# (tools.ts, and a plugin's own file); each refers to this file by its name,
# and a name missing here fails at module load rather than serving a tool
# with no description.
#
# A description that depends on something this file cannot know keeps a named
# placeholder, `{{pages}}` in `guide` for example, which the code fills in when
# the tool is built.

space_new:
  title: Create a space
  description: >-
    Create another space on yaks.app, at <slug>.yaks.app, with the person as
    its owner. Signing in already gave them one, and every other tool uses
    that one unless told otherwise, so this is only for a second address.

space_set:
  title: Rename or move a space
  description: >-
    Change a space's name or move it to another address. The title is its
    name; the slug is its address, so changing the slug moves the space to
    <new>.yaks.app. Every app in it moves with it, files and data included,
    and each app keeps its own path under the new address. The old address
    keeps working: it redirects to the new one, path included, so an
    existing link still opens the same page, and email to
    <old>.<app>@yaks.app still arrives. The old address also stays reserved:
    nobody else can take it, and neither can this space, until it is
    forgotten. Give the person the new address. Only the space owner may move
    it. Pass forget with an address the space has already left to drop it:
    it stops redirecting and anyone can take it, so every link and every
    email still aimed there finds nothing. Do that only when the person has
    said they are done with that address.

space_delete:
  title: Delete a space
  description: >-
    Delete a space: it goes to the trash for 30 days. Every app in it stops
    answering, its address stops serving and its apps disappear from your
    tools, but nothing is erased, the address is held, and space_restore
    brings the whole space back within those 30 days. After that the platform
    erases it: the apps, everything they saved, their files, any domain
    attached to them, and the address becomes available again. This tool
    cannot delete the space itself: it emails the space's owner a
    confirmation link, valid for one hour, and returns a summary of what that
    link would stop. Read that summary back to the person and tell them to
    check their email; the confirmation is theirs to give, not yours. Only
    the space owner may ask, and app_delete is the smaller action when they
    mean one app. Pass forever: true and the link erases the space at once
    instead, with nothing kept and no undo; do that only when the person has
    said they mean exactly that. To undo a delete: space_restore, any time in
    those 30 days.

space_restore:
  title: Restore a deleted space
  description: >-
    Bring back a space that was deleted. Every app in it serves again at the
    address it always had, its tools and pages come back, and everything it
    saved is exactly as it was; nothing is touched while a space sits in the
    trash. Works within 30 days of the delete being confirmed; after that the
    space has been erased and there is nothing to bring back. Unlike
    space_delete, the assistant may do this itself: restoring a space needs
    no confirmation from the owner.

space_sell:
  title: Connect Stripe to a space
  description: >-
    Connect this space to Stripe so its apps can take payments. Requires
    Plus. The tool returns a link where the person finishes setting up with
    Stripe (their name, their bank account, whatever Stripe asks); all of
    that happens at Stripe, and yaks.app never sees or holds any of it. They
    are the merchant: the charge, the money, the name on the customer's
    statement, and any refunds and disputes are theirs. Give the person the
    link and stop: nobody can sell until they have finished at Stripe, and
    calling again returns a fresh link to the same Stripe account, never a
    second account. Once they are done, every app in the space can take
    payments through POST /api/pay/checkout; see the selling guide page.
    Pass disconnect: true to stop selling through this space; their Stripe
    account and everything in it stays theirs, this space just stops
    charging on it.

app_new:
  title: Create an app
  description: >-
    Create a new app, the thing you are building for the person. It is
    served at <space>.yaks.app/<slug>/, and the first app in a space also
    answers at the bare space address. Then call app_files to write
    index.html, app_deploy to release it, and give the person the link. Pass
    access when the app is for other people too: 'open' if anyone with the
    link should be able to write to it (vote, add a line, sign up), and
    'private' if only the person and whoever they invite (member_add) should
    see it at all.

app_files:
  title: Read or write app files
  description: >-
    Write the app's files (index.html and any css, js or images beside it),
    or list them, read one back, or delete one. Write a whole app in one
    call with files: [{path, content}, …]; passing a files list is the write,
    so leave op out. path and content write a single file, and base64 in
    place of content writes a file that is not text, such as an image or the
    .wasm a worker.js imports. Files are served live at
    <space>.yaks.app/<app>/<path>, and index.html serves the directory. Keep
    the app's data in its own store, never localStorage: the page reads
    and writes the store with `import { apply, query, search } from
    './api/client.js'`, which is served beside the app. Write every URL
    relative: the platform gives each page a `<base>` at the app's own
    address, so nothing in an app needs to name the app, and a copy someone
    installs at another address still works. Every write returns what it
    stored: the byte count and the sha256, and for a .json file whether it
    parses, with the position of the error when it does not, so a
    miscounted bracket is caught in the call that made it. NOTES.md beside
    index.html holds the app's own notes (how the app is maintained, in the
    person's words, up to 4 KB), and the about tool returns them. Like
    vocab.json, it is internal to the app: never served on the web, only
    read back here.
    op: patch with path, find and replace edits one file in place; find is
    an exact string and must occur exactly once. op: fetch with path and url
    downloads an https response body to path, which is how a library is
    vendored without transcribing it, and returns an integrity hash for it.
    Nothing a write or a delete replaces is lost: the previous bytes are
    kept for 30 days. op: history with path lists them newest first (sha256,
    size, when it was replaced and by whom), and op: restore with path puts
    one back, the newest by default or the one sha or at names. A restore is
    itself a write, so it too can be undone. Call guide for the full
    reference, or read it at https://yaks.app/guide.md. To undo any write,
    patch, fetch or delete here: op: history, then op: restore.

sandbox_exec:
  title: Run a build command
  description: >-
    Run one command in this space's build sandbox, a Linux container for
    what a browser cannot do on its own: compile something to WebAssembly,
    run a generator, minify an asset. Installed: Rust 1.98.1 with the
    wasm32-unknown-unknown target, wasm-bindgen 0.2.128 and wasm-opt 132;
    Python 3.13.15 with pip; Go 1.27.1; Zig 0.16.0, which is also the C and
    C++ compiler here (`zig cc -target wasm32-freestanding -nostdlib
    -Wl,--no-entry` produces a module a browser loads with no glue code, and
    -target wasm32-wasi one that a WASI shim runs); Deno 2.9.1, and the Node
    and Bun the base image ships. Anything else can be installed for the
    duration of the build: the command runs as root, so `apt-get install -y
    <pkg>` or a download works, and it costs the next build nothing. Write
    the source with sandbox_write, build it here, then sandbox_ship the
    artifact into the app. An app needs none of this, since html, css and js
    run as they are, so use the sandbox only when something must be
    compiled. The sandbox is signed in as the person: `yak` is installed and
    $YAKS_TOKEN and $YAKS_HOST are set, so `yak <tool>` and curl can call
    these same tools from inside a script, and the token expires with the
    container. The container is metered: every second it is running is
    charged to the space, and one build gets {{budget}} of them, so plan the
    build and run it once rather than iterating inside it. The container is
    destroyed when the build ends, and everything in it with it. Nothing to
    undo: nothing of the app lives here. The container is disposable, and
    only sandbox_ship copies anything out of it.

sandbox_write:
  title: Write a build file
  description: >-
    Write one file inside this space's build sandbox: a Cargo.toml, a
    src/lib.rs, whatever the build needs. These are not the app's files:
    nothing here is served, and everything here is gone when the build ends.
    app_files writes what the app serves; sandbox_ship copies a built
    artifact from the sandbox into the app. Waking the sandbox is metered by
    the second, as with sandbox_exec. Nothing to undo: nothing of the app
    lives here. The container is disposable, and only sandbox_ship copies
    anything out of it.

sandbox_read:
  title: Read a build file
  description: >-
    Read one file out of this space's build sandbox: a generated source, a
    build log, whatever the last command left behind. Waking the sandbox is
    metered by the second, as with sandbox_exec.

sandbox_ship:
  title: Copy build output into the app
  description: >-
    Copy what the build produced into the app, where it is served: name the
    files in the sandbox (pkg/*.wasm, pkg/*.js) and each is written beside
    index.html under its own filename, as if app_files had written it. This
    is the last step of a compile: the sandbox is discarded and the app keeps
    the artifact. Binary files are copied as bytes, so a .wasm arrives
    intact. Waking the sandbox is metered by the second, as with
    sandbox_exec. To undo: these are written through app_files, so each
    keeps the bytes it replaced; use app_files op: history, then op:
    restore.

app_deploy:
  title: Release a version
  description: >-
    Release what you have written. The files are already live, so this marks
    them as one version, the one an error report will name. Do it when the
    app is ready to show, then give the person the URL. It also creates the
    components the app's vocab.json declares ({{vocab}}), so the app gets
    typed components of its own. A component name the platform already uses
    is refused, and the whole manifest is refused with it before anything is
    created; a component this manifest no longer names, and that holds no
    rows, is dropped. It reports the columns it added and the columns the
    store still has that this manifest did not name: a column is never
    renamed or retyped, so a new name is added beside the old one, which
    keeps every row already written under it. A seed.json beside index.html
    (a list of bundles, or a seed/ folder of *.json files when there are
    many) is written into the app's store here, once per store and after the
    components, so the app opens with data in it; deploying again seeds
    nothing. A tools.json beside index.html gives the app commands of its
    own ({{tools}}), which everyone who can reach the app runs with the
    command tool, so the person and their agent act on the app through its
    own commands. A worker.js beside index.html becomes the app's own server
    code: it handles every request that is not under /api/ before the files
    do, and whatever it answers 404 falls through to the files. Every deploy
    is kept, so app_rollback can put this one back later. If the app is
    published, the published version does not move with it: what strangers
    install stays the version you published until you call app_publish
    again, and this tool says so when the published version starts falling
    behind. To undo: app_rollback, which puts an earlier deploy back as a
    new version.

store_load:
  title: Load a data file into the store
  description: >-
    Write a data file the app already contains into the app's store, now.
    path is one file (data/cities.json) or a folder, in which case every
    *.json and *.csv under it is loaded. A JSON file holds the same list of
    bundles a seed.json does and graph_apply accepts: [{"entity": {"eid":
    "$a"}, "doc": {"title": "…"}}]. A CSV is a spreadsheet, and `as` names
    the component one row becomes: as: "city" with headers name,country
    writes city{name, country} per row, values converted to the column types
    the vocabulary declares. `title` and `body` columns go into the row's doc
    component; an `id` (or `alias`) column is the row's name, stored as
    alias{name}, which resolves to the entity already holding that name, so
    loading the file again patches those rows instead of duplicating them,
    and the name can be used anywhere an eid can. map {"Serves how many":
    "serves"} renames a header that does not match a column. A header that
    matches no column is refused, as is a cell that will not convert, and
    the error names the row and the header. All the files are loaded in one
    transaction, read in filename order, so an alias created in one file
    resolves in the next; if the store refuses a bundle nothing is written
    and the refusal names the file and the entry that caused it. This is how
    a large dataset gets in without being typed into a call: app_files(op:
    fetch) downloads the file into the app, store_load writes it into the
    store, two calls. Unlike a seed it is not once-only: call it whenever
    you like, and it patches and adds as the caller, so the rows carry your
    attribution. It applies whatever the file contains, deletes included: a
    bundle with $delete: true (or tombstone: {}) deletes that entity, and
    the store decides whether you may. A bundle naming an eid patches that
    row; one naming a $alias creates a new entity each run, unless it
    carries alias: {name: "…"}, which resolves to the entity already holding
    that name, so a file loaded twice is a patch and not a second copy.

app_versions:
  title: List app versions
  description: >-
    Every deploy of the app, newest first, with when it went out and what
    changed in it. Read it when the person says the app used to work, or
    before rolling back, so you name the version they mean. The app keeps
    its last 20.

app_rollback:
  title: Roll back to an earlier version
  description: >-
    Put the app back to an earlier deploy: every file of that deploy, its
    components, its tools and its worker code with them. Use it when the
    person says a change broke something or asks for the old version back;
    you do not need to remember what you wrote. It goes out as a new
    version, so nothing is lost and a rollback can itself be rolled back.
    Leave version out for the deploy before the live one, or name one from
    app_versions. Give the person the URL and tell them what came back.
    Their data is never touched, only the files. To undo: another
    app_rollback, since this goes out as a new version and app_versions
    still lists the one you left.

store_restore:
  title: Restore the store to a point in time
  description: >-
    Put everything the app has saved back to how it was at a moment: the
    whole store, every row of it, as of that time. Use it when a write went
    wrong and the person wants their data back: a bad import, rows deleted
    that should not have been, a change that turned out to be wrong.
    Cloudflare keeps the last 30 days of the store, so any moment in those
    30 days can be restored; at is that moment, as a timestamp
    (2026-09-06T14:20:00Z). Call it with no at first: it reports the oldest
    moment still available and every restore already made. It is
    reversible: where the store stood before is recorded before anything
    moves, so a restore is undone by restoring again to a moment just before
    it, and the response gives you that exact command. What it costs is
    everything written since the moment you name, so name the latest moment
    that will do. The app is briefly restarted to pick up the restored
    store. The app's files are not part of this; app_rollback and app_files
    op: restore put those back. To undo: another store_restore, to the
    moment just before this one, which the response gives you.

app_set:
  title: Rename, move or reshare an app
  description: >-
    Rename an app, move it to another address, or change who may use it.
    The title is its name; the slug is its address, so changing the slug
    moves the app to <space>.yaks.app/<new>/. Its files and everything it
    has saved move with it, and the old address redirects to the new one, so
    an existing link still works. Give the person the new link. access is
    the same choice app_new offers: 'open' when they want everyone with the
    link to be able to write to the app, 'private' to close it to everyone
    but its members. home makes this app the space's front page: what
    <space>.yaks.app/ opens, the app someone lands on when given the space
    address itself. The first app created in a space is the front page until
    someone says otherwise, so set it when the app they care about was not
    the first one; home: false leaves the space with no front page. Only the
    space owner may change it. first is the front page's own routing: the
    paths its worker.js handles before the app whose name owns them, as
    globs; ["/recipes/*"] sends every address under /recipes/ to the front
    page instead of the recipes app. Leave it alone unless the front page is
    meant to route the whole space; an empty list puts every path back where
    it was. gallery is whether a published app is submitted for
    https://yaks.app/gallery, the public page of apps made here: true
    submits it, false withdraws it at once. Set it only when the person has
    said which they want. Pass forget with an address this app has already
    left to drop it: it stops redirecting and another app can be created
    there, so every link still aimed at it finds nothing. Only the space
    owner may do that, and only when the person has said they are done with
    that address.

app_secret_set:
  title: Set a worker secret
  description: >-
    Give the app's worker a secret for an outside service (an API key, a
    token) without the page ever holding it. The value is stored on the
    app's worker script and nowhere else: not in the app's data, not in its
    history, and no tool, this one included, can read it back. Only the
    worker can, as env.NAME, so name it the way its code will refer to it:
    app_secret_set(app, name: 'WEATHER_KEY', value) and then `fetch(url,
    {headers: {authorization: env.WEATHER_KEY}})` in worker.js. Ask the
    person for the value; never invent one. Setting a name that already
    exists replaces its value. The app needs a worker.js (uploaded by
    app_deploy) for the secret to reach any code.

app_secret_list:
  title: List worker secrets
  description: >-
    The names of the secrets the app's worker can read. Values are never
    returned, by this tool or any other. Use it to see what a worker.js may
    read as env.NAME.

app_secret_remove:
  title: Remove a worker secret
  description: >-
    Remove a secret from the app's worker. Its code stops seeing env.NAME at
    the next request; nothing else about the app changes. To undo:
    app_secret_set with the value again. A secret is never readable once
    set, so this is the one thing here that nothing can restore for you.

app_delete:
  title: Delete an app
  description: >-
    Delete an app: it goes to the trash for 30 days. Its address stops
    answering, its tools and pages disappear from your tools, and it stops
    being the front page, but its files, everything it saved and its slug
    are all kept, and app_restore brings the whole app back within those 30
    days. After that the platform erases it for good. Use it only when the
    person asks for the app to be deleted; app_files op: delete removes one
    file, and app_set moves an app rather than replacing it. Pass forever:
    true to skip the trash and erase it now, only for a person who means it,
    since nothing is kept and there is no undo. To undo a delete:
    app_restore, any time in those 30 days.

app_restore:
  title: Restore a deleted app
  description: >-
    Bring back an app that was deleted. It serves again at the address it
    always had, its tools and pages come back, and everything it saved is
    exactly as it was; nothing is touched while an app sits in the trash.
    Works within 30 days of app_delete; after that it has been erased and
    there is nothing to bring back. app_list shows what is in the trash and
    how long each app has left.

app_errors:
  title: List open errors
  description: >-
    Everything still broken in the app: what a page threw in someone's
    browser, what a request threw on the server, and what the platform
    reported. Each is an entity in the app's store. New ones are also
    appended to your next reply, once. Pass `fixed` with the ids you have
    fixed and they are archived, which removes them from this list and from
    your replies; pass `seen` to archive errors you are done with without
    listing every id: `all`, `v3` for everything up to and including that
    deploy, or a date.

app_list:
  title: List the person's apps
  description: >-
    What the person already has here: every app in every space of theirs,
    with its address, the email address it sends and receives at, the
    version it is at, how many errors are still open in it, which app is the
    space's front page, and what the month has cost against what the space
    is allowed. Read it before creating a second app, and when they ask what
    they have or where something lives. Deleted apps are listed under Trash
    with the days each has left, until app_restore brings it back or the 30
    days run out.

commands:
  title: List app commands
  description: >-
    The commands the apps here declare, with the arguments each one accepts.
    An app's own commands (the ones its tools.json declares, and the two
    every component it holds gets, such as add_recipe and find_recipe) are
    listed here rather than in this tool list, which is the same for
    everybody. Read it when a request sounds like something an app of theirs
    already does, then run one with command.

command:
  title: Run an app command
  description: >-
    Run one of an app's own commands: name it and pass its arguments as
    args, exactly as commands lists them. app is only needed when two apps
    here declare the same command name. The command runs through the app's
    ordinary API endpoints as the person calling it, so it can do what they
    could do on the page and never more. To undo whatever it wrote:
    store_restore, to the moment just before it ran.

domain_attach:
  title: Attach a custom domain
  description: >-
    Serve a domain the person already owns, herbusiness.com instead of
    jeff.yaks.app. Name an app and that app answers at the root of the
    domain; leave app out and the whole space answers there, exactly as it
    does at <space>.yaks.app: the front page at /, every app at /<app>/. A
    space and each of its apps can have their own domain at the same time.
    The tool registers the hostname here and returns the DNS record the
    person has to add where their domain is managed, as data: type, name,
    value. Add it for them if you can reach their registrar; otherwise walk
    them through their registrar's control panel, since you know what
    GoDaddy's and Namecheap's look like. Nothing serves until that record is
    in place, so tell them the record, then use domain_status to watch it
    come up. Only the space owner may attach one. Custom domains require
    Plus unless the space is exempt. On plan_required, give the person
    settings_url to compare paid plans in their space settings; never give
    them a checkout link. Sign-in returns them to that page. No hostname is
    registered until the space is eligible.

domain_status:
  title: Check a domain
  description: >-
    How far a domain has come, and what it points at: the space, or one of
    its apps. Whether the DNS record has arrived, whether Cloudflare has
    accepted the hostname, and whether the certificate is issued, each
    reported specifically enough to tell the person what is still waiting on
    them. It is read from Cloudflare, not from what was last recorded here.
    Leave hostname out to check every domain in the space. Call it after
    domain_attach, and again a few minutes later; nothing needs doing in
    between.

domain_detach:
  title: Detach a custom domain
  description: >-
    Stop serving at a domain, whether it served a space or one app. The
    hostname is released back to Cloudflare and what it served is untouched:
    it still answers at its <space>.yaks.app address, and its data and files
    are not involved. The person's DNS record is theirs to remove wherever
    their domain is managed; until they do, it points at nothing. Only the
    space owner may detach. To undo: domain_attach with the same hostname,
    which starts the certificate again.

app_publish:
  title: Publish an app for others to install
  description: >-
    Publish this app so anyone in any other space can install it by name.
    Someone else then calls app_install and gets their own copy: their own
    store, their own address, their own data from the first byte, pinned to
    the version you published; nothing is shared but the code. The name is
    platform-wide, so it is the app's slug unless that is taken, and a taken
    name is refused. Publishing again publishes whatever is deployed now
    under the name it already has; a name is claimed once, and only an
    explicit new name moves it, which leaves the old name resolving to
    nothing. Nobody who installed it moves to the new version until they
    call app_update. Only the space owner may publish, and only what the
    person asked to share. gallery: true also submits it to be shown on
    https://yaks.app/gallery, a public page of what people have made. That
    is separate from publishing and always the person's own choice: ask
    them, never assume. It is not listed at once; yaks.app reviews the
    submission and decides, and the app is published either way.

app_unpublish:
  title: Unpublish an app
  description: >-
    Stop offering the app for install. It stays exactly as it is, and so
    does every copy anyone installed, since their data is theirs, but nobody
    new can install it, and the name is free again. It leaves the gallery at
    the same moment, if it was on it. Only the space owner may unpublish. To
    undo: app_publish, which publishes it again under the same name unless
    somebody else has taken it meanwhile.

app_published:
  title: List published apps
  description: >-
    What other people have published here, newest first: the name to
    install by, what the app is, and which space it came from. Read it when
    the person asks for something somebody may already have made; installing
    one is app_install, which gives them their own copy with their own data.
    Pass words to list only the apps whose name, title or description
    contain them. It needs no account: a published app is offered to
    everybody, and its own pages are readable at the address printed here.

app_install:
  title: Install a published app
  description: >-
    Take an app somebody published (app_published lists them) and give the
    person their own copy of it: their own address, their own data store,
    their own everything from the first byte. Nothing is shared but the
    code, so what they save is theirs alone and the publisher never sees it.
    The copy is pinned to the version it was installed from; the publisher's
    next version does not arrive on its own, and app_update moves the copy
    forward while keeping their data. Then give them the link.

app_update:
  title: Update an installed app
  description: >-
    Move an installed app to whatever version its publisher offers now. The
    person's data stays: every row they saved is theirs and is not touched.
    Only the code is replaced, so anything you wrote into the copy yourself
    is replaced too. A vocabulary that only added columns is applied to
    their store; one that would retype a column their rows were written
    under is refused, and nothing moves. It reports what changed. To undo:
    app_rollback, since the update goes out as a version like any other and
    app_versions lists the one before it.

member_add:
  title: Invite someone
  description: >-
    Invite someone by email address, so they can change what an app holds:
    an editor writes, a viewer only reads, an owner may also invite. Name
    the app and that one app is all they get, its page and its data and
    nothing else in the space; this is how a player joins one game or a
    household opens one list without being given everything else you keep
    here. Leave the app out and they are added to the space, which reaches
    every app in it. Either way the invitation is emailed to them: who
    invited them, the link, and that signing in there with that address is
    all it takes. Pass a note and the person's own message goes at the top
    of that email, as written and quoted as theirs: a line or two saying
    what this is ("the potluck list for Saturday"), which is the difference
    between an invitation someone opens and one they wonder about. Pass
    their name if you know it and their apps will show it beside what they
    write, so nobody sees an address; they can set it themselves at their
    first sign-in. There is nothing for them to install and no account to
    create first. Only the space owner may invite. For an app that everyone
    with the link should be able to write to without signing in at all, set
    access 'open' instead (app_set).

member_remove:
  title: Remove someone
  description: >-
    Remove someone: name the app and they lose that one app and keep the
    rest, name none and they lose the space. Either way they keep their
    sign-in. Only the space owner may remove, and the last owner cannot be
    removed, since a space with no owner is one nobody can ever open again.
    To undo: member_add with the same address, which puts them back where
    they were.

grant:
  title: Create a CLI token
  description: >-
    A short-lived token that signs the `yak` CLI in as this person: the same
    identity and exactly the same access they have here, never more. Use it
    when someone wants to work from their own terminal, or wants a script to
    reach their apps; the response is the one line they paste. It lasts an
    hour unless `hours` says otherwise (24 at most), and `space` limits it
    to one space, which is the right choice when the token is going
    somewhere less safe than their laptop. Show them the response as it is:
    the token is shown once and stored nowhere it can be read back. `revoke`
    cancels a token before it expires, by the id the response that created
    it named.

feedback:
  title: Send feedback about yaks.app
  description: >-
    The tool for all feedback about yaks.app itself: this connector, its
    tools, its guide, the way an app is built or served here. A bug, a rough
    edge, a step that took three tries, a confusing answer, a wish, a
    feature idea, a thing that went well: all of it is wanted, from what you
    ran into working here or in the person's own words. Not for the app you
    are building for the person: an error inside their own app is theirs and
    yours to fix (app_errors lists those). Use it the moment something comes
    up: a tool that refused for no reason you could find, a page or tool
    that does not exist, an answer that disagreed with the guide, a step the
    person found baffling, something they wished this place did, a sentence
    they said about any of it. Where something is broken, go ahead and work
    around it; nobody sees the workaround, and this report is what they see
    instead. Say what the person said, in their own words, and what you
    tried and what happened; those two are the whole report. Who they are,
    their space, the app if you name one, and the versions are attached
    automatically; do not repeat them. It reaches a person by email, and
    they can write back. It works signed out too: the report then records
    that it came from someone signed out, and there is no address to reply
    to, so put one in the text if a reply is wanted.

guide:
  title: Read the guide
  description: >-
    The guide, read here instead of fetched from the web. With no page: the
    overview, which says what an app is, how its pages read and write its
    store, and has a paragraph on every feature there is. Read that first.
    With a page: the whole of one subject. The pages are {{pages}}. A name
    that is none of them returns the overview, which lists them all. The
    same pages are served to a person at https://yaks.app/guide.md.

about:
  title: What yaks.app is
  description: >-
    What yaks.app is and what gets made here. Call it when someone asks what
    this place is, or when you have not signed in and want to know what
    works signed out and what signing in would add; it answers in a
    paragraph and says where to sign in. Signed in, it also reports who you
    are signed in as, how (a browser, a connector, a CLI token) and until
    when, the tools this connector is listing right now, and every app you
    can reach: its address, what it holds, the notes it keeps and whatever
    the person has said in that space. Signed out it reads nothing about
    anybody: the same answer for everyone.

gallery_search:
  title: Search the gallery
  description: >-
    Find an app somebody has already made and shown at
    https://yaks.app/gallery: a recipe box, a sign-up sheet, a tracker. Pass
    the words the person used. Each result includes the command that gives
    them their own copy of it, at their own address with their own data.
    Check it before building something from scratch. It works signed out
    too: the gallery is public.

memory_save:
  title: Save what the person said
  description: >-
    Save what the person said about how they want something built or
    handled, in their words, as they said them. Use it the moment they state
    a preference, a standard, a taste, a way of working, a thing they never
    want done again: "use grams, never cups", "keep it soft, not technical",
    "always show me the link". Save the sentence verbatim: never your
    summary of it, never a tidied-up version, never what you concluded from
    it. A summary can only lose what they said, and nobody can get it back.
    Add context only where the words are unreadable without it, one line
    saying what was being talked about and no more; the words themselves
    carry the rest. It is kept for the whole space, so everyone working
    there sees it, and the about tool returns the newest few to any agent
    that asks. What is only about one app belongs in that app's NOTES.md
    instead (guide page notes), and a document you wrote (an overview, how
    something works, why it was built that way) belongs in the app's store
    as a doc entity, which search finds again (guide page memory, Project
    documents). Only their own sentences go here.

memory_recall:
  title: Recall what the person said
  description: >-
    What the person has said about how they want things done, in their own
    words, ranked against the words you pass. Ask before building or
    changing an app, and whenever a choice is theirs to have made: how a
    page should look, what a thing should be called, how they want to be
    told about something. The newest few arrive with every connection
    already; this is how the rest are found. Returns each memory whole, with
    the line of context saved beside it.

app_stats:
  title: App traffic
  description: >-
    How many people opened the app, and where they came from: visits per day
    for the last month, the pages they opened, the sites that linked to
    them, and the countries they were in. Aggregate counts and nothing else:
    no visitor is identified, no address and no session is kept, so this can
    never say who someone was or what one person did. Use it when they ask
    whether anyone is using the app, or which page is worth working on. Only
    the app's own members may ask.
