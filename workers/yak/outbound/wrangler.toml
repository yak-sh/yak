# yak-out (worker.ts): the kernel's dispatch namespace's outbound Worker, which
# hands every fetch an app's worker makes back to the kernel. Workers Builds
# deploys only the kernel, so a change here is deployed by hand:
# `deno task deploy:yak-out` and `deno task deploy:yak-out-staging`, before the
# kernel that names it.
name = "yak-out"
main = "worker.ts"
account_id = "0f9613dfd3f0451df0bd0f12a1372ea3"
compatibility_date = "2025-05-08"
workers_dev = false
preview_urls = false

[[services]]
binding = "YAK"
service = "yak"
entrypoint = "Outbound"

[env.staging]
name = "yak-out-staging"
workers_dev = false
preview_urls = false

[[env.staging.services]]
binding = "YAK"
service = "yak-staging"
entrypoint = "Outbound"
