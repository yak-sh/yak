# yak-out (worker.ts): the kernel's dispatch namespace's outbound Worker, which
# hands every fetch an app's worker makes back to the kernel. The kernel's own
# deploy deploys it first, to the same environment (../wrangler.ts `outbound`),
# so a push to main ships both.
name = "yak-out"
main = "worker.ts"
account_id = "0f9613dfd3f0451df0bd0f12a1372ea3"
compatibility_date = "2025-05-08"
workers_dev = false
preview_urls = false

[[services]]
binding = "YAK"
service = "yak"
entrypoint = "Outbound"

[env.staging]
name = "yak-out-staging"
workers_dev = false
preview_urls = false

[[env.staging.services]]
binding = "YAK"
service = "yak-staging"
entrypoint = "Outbound"
