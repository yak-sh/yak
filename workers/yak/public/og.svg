<!--
  The card a link to yaks.app unfurls as, and the source og.png is drawn from
  (T-34288). Everforest, the same tokens as style.css: linen ground, coffee
  wordmark, meadow rule, and the raster yak beside it. No webfont — Nunito is
  the site's face but an OG card is rasterized once and every renderer here has
  its own fonts, so the wordmark is set in whatever grotesque the machine has.

  Redraw after an edit:  rsvg-convert -w 1200 -h 630 -f png -o og.png og.svg
-->
<svg xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630"
  viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fdf7ee" />
  <rect x="0" y="0" width="1200" height="14" fill="#4c773e" />
  <image xlink:href="yak.png" x="720" y="105" width="430" height="416" />
  <text x="90" y="255" font-family="Lato Heavy, Lato, sans-serif"
    font-weight="900" font-size="112" fill="#523828">yaks.app</text>
  <rect x="92" y="285" width="150" height="10" rx="5" fill="#4c773e" />
  <text x="90" y="378" font-family="Lato, sans-serif" font-weight="700"
    font-size="44" fill="#785b47">Build an app by asking</text>
  <text x="90" y="436" font-family="Lato, sans-serif" font-weight="700"
    font-size="44" fill="#785b47">Claude or ChatGPT.</text>
  <text x="90" y="516" font-family="Lato, sans-serif" font-weight="400"
    font-size="30"
    fill="#785b47">Your assistant builds it. We keep it online.</text>
</svg>
