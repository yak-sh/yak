<!doctype html>
<!--
  The first MCP App view (T-32492, D-32318 §The agent door): what the person
  has here, drawn where they already are. The host fetches this page through
  `resources/read` on `ui://yaks/apps` — the tool app_list links to it with
  `_meta.ui.resourceUri` — and renders it in a sandboxed iframe, handing the
  tool's answer over postMessage. No portal, no dashboard: the home page's
  voice, one column, a card per app.

  The protocol is the MCP Apps dialect (spec 2026-01-26, §Communication): the
  view sends an `ui/initialize` REQUEST, then an `ui/notifications/initialized`
  notification, and the host answers with the tool's result in
  `ui/notifications/tool-result` (a CallToolResult; ours carries
  structuredContent). The view reports its height back with
  `ui/notifications/size-changed` so the host can size the frame.

  Everything is inline on purpose: with no `ui.csp` metadata the host serves
  this under `default-src 'none'`, so a stylesheet or a font from anywhere
  else would simply not load.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your apps</title>
    <style>
    /* The home page's palette (public/style.css), inlined. The host may
       hand us its own theme variables; those win where it does. */
    :root {
      color-scheme: light dark;
      --ground: #fdf7ee;
      --paper: #fffbf5;
      --ink: #523828;
      --soft-ink: #785b47;
      --line: #efe3d2;
      --meadow: #5c8a4c;
      --nose: #d99a8d;
      --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #2b231f;
        --paper: #372c26;
        --ink: #f1e6d8;
        --soft-ink: #c9b19c;
        --line: #4d3d34;
        --meadow: #a7c080;
      }
    }

    body {
      margin: 0;
      padding: 1rem;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
    }

    .Apps {
      margin: 0 auto;
      max-width: 30rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .Apps_Space {
      margin: 0.5rem 0 0;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--soft-ink);
    }

    .App {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      padding: 0.85rem 1rem;
    }

    .App_Title {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .App_Link {
      color: var(--meadow);
      text-decoration: none;
      word-break: break-all;
    }

    .App_Link:hover {
      text-decoration: underline;
    }

    .App_Note {
      margin: 0.35rem 0 0;
      font-size: 0.85rem;
      color: var(--soft-ink);
    }

    .App_Note-broken {
      color: var(--nose);
    }

    .Apps_Quiet {
      color: var(--soft-ink);
      font-style: italic;
    }
    </style>
  </head>
  <body>
    <main class="Apps" id="apps">
      <p class="Apps_Quiet">Looking…</p>
    </main>
    <script>
    let call = (method, params) =>
      window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*')

    let asked = 1
    let request = (method, params) =>
      new Promise((resolve) => {
        let id = asked++
        window.addEventListener('message', function heard(e) {
          if (e.data && e.data.id === id) {
            window.removeEventListener('message', heard)
            resolve(e.data.result)
          }
        })
        window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*')
      })

    let el = (tag, cls, text) => {
      let node = document.createElement(tag)
      if (cls) node.className = cls
      if (text != null) node.textContent = text
      return node
    }

    // A count reads as a sentence or not at all: "no errors" is not news.
    let note = (app) => {
      let bits = []
      if (app.version) bits.push('version ' + app.version)
      else bits.push('not released yet')
      if (app.errors) {
        bits.push(app.errors + (app.errors == 1 ? ' break' : ' breaks'))
      }
      // The one the space's own address opens (T-32947).
      if (app.home) bits.push('the front page')
      return bits.join(' · ')
    }

    let draw = (data) => {
      let root = document.getElementById('apps')
      root.textContent = ''
      let spaces = (data && data.spaces) || []
      let apps = spaces.reduce((n, s) => n + s.apps.length, 0)
      if (!apps) {
        root.append(
          el('p', 'Apps_Quiet', 'Nothing here yet — ask for your first app.'),
        )
        return sized()
      }
      for (let space of spaces) {
        // One space needs no heading: the apps are all there is.
        if (spaces.length > 1) {
          root.append(el('p', 'Apps_Space', space.slug))
        }
        for (let app of space.apps) {
          let card = el('article', 'App')
          card.append(el('h2', 'App_Title', app.title || app.slug))
          let link = el('a', 'App_Link', app.url)
          link.href = app.url
          link.target = '_blank'
          link.rel = 'noreferrer'
          let where = el('p', 'App_Note')
          where.append(link)
          card.append(where)
          card.append(
            el(
              'p',
              'App_Note' + (app.errors ? ' App_Note-broken' : ''),
              note(app),
            ),
          )
          root.append(card)
        }
      }
      sized()
    }

    // The host sizes the frame from what we report (spec §Sizing), so the
    // measure is the CONTENT's — the document fills whatever frame we were
    // given and would only ever report that back.
    let sized = () =>
      call('ui/notifications/size-changed', {
        width: document.body.scrollWidth,
        height: document.body.scrollHeight,
      })

    window.addEventListener('message', (e) => {
      let msg = e.data
      if (!msg || msg.method != 'ui/notifications/tool-result') return
      let result = msg.params || {}
      // The data is the tool's structuredContent. A host that forwards only
      // the text gets the same answer read out, which is what the model
      // reads too.
      if (result.structuredContent) return draw(result.structuredContent)
      let said = (result.content || []).map((p) => p.text).join('\n')
      let root = document.getElementById('apps')
      root.textContent = ''
      root.append(el('p', 'Apps_Quiet', said))
      sized()
    })

    request('ui/initialize', {
      protocolVersion: '2026-01-26',
      appCapabilities: { availableDisplayModes: ['inline'] },
      clientInfo: { name: 'yaks.app apps view', version: '1' },
    }).then((result) => {
      let vars = ((result || {}).hostContext || {}).styles
      vars = (vars || {}).variables || {}
      // The host's own theme, where it has one to lend.
      let lend = {
        '--ground': '--color-background-primary',
        '--ink': '--color-text-primary',
        '--font': '--font-sans',
      }
      for (let ours in lend) {
        let theirs = vars[lend[ours]]
        if (theirs) document.documentElement.style.setProperty(ours, theirs)
      }
      call('ui/notifications/initialized', {})
      sized()
    })

    new ResizeObserver(sized).observe(document.body)
    </script>
  </body>
</html>
