<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170">
  <!--
    The yak, once. This file is the favicon, the small mark every page but the
    home page shows through <img>, and the drawing the home page and the style
    guide pull in with <use href="yak.svg#yak">.

    Painted twice over: the presentation attributes are the drawing's own
    colours, and the rules below re-point each shape at the page's theme role
    when there is a page (a <use> shadow tree inherits custom properties from
    the element that references it). On its own — as a favicon, or in an <img>
    — no role is set, the fallback wins, and it looks exactly the same as it
    always did. The roles themselves live in style.css.
  -->
  <style>
    .Yak_Fur { fill: var(--yak-fur, #8b6a52) }
    .Yak_Face { fill: var(--yak-face, #a8846a) }
    .Yak_Fringe { fill: var(--yak-fringe, #5e4634) }
    .Yak_Horn { fill: none; stroke: var(--horn, #e6d2b5); stroke-width: 10; stroke-linecap: round }
    .Yak_Eye { fill: var(--yak-eye, #3a2b22) }
    .Yak_Glint { fill: var(--glint, #fff) }
    .Yak_Nose { fill: var(--nose, #d99a8d) }
    .Yak_Smile { fill: none; stroke: var(--yak-eye, #3a2b22); stroke-width: 3; stroke-linecap: round }
  </style>
  <g id="yak">
    <ellipse class="Yak_Fur" fill="#8b6a52" cx="100" cy="112" rx="72" ry="44" />
    <rect class="Yak_Fur" fill="#8b6a52" x="46" y="132" width="22" height="34"
      rx="11" />
    <rect class="Yak_Fur" fill="#8b6a52" x="76" y="136" width="22" height="34"
      rx="11" />
    <rect class="Yak_Fur" fill="#8b6a52" x="102" y="136" width="22" height="34"
      rx="11" />
    <rect class="Yak_Fur" fill="#8b6a52" x="132" y="132" width="22" height="34"
      rx="11" />
    <path class="Yak_Horn" fill="none" stroke="#e6d2b5" stroke-width="10"
      stroke-linecap="round" d="M66 54c-16-4-28-20-22-40" />
    <path class="Yak_Horn" fill="none" stroke="#e6d2b5" stroke-width="10"
      stroke-linecap="round" d="M134 54c16-4 28-20 22-40" />
    <ellipse class="Yak_Fur" fill="#8b6a52" cx="54" cy="78" rx="13" ry="9" />
    <ellipse class="Yak_Fur" fill="#8b6a52" cx="146" cy="78" rx="13" ry="9" />
    <circle class="Yak_Face" fill="#a8846a" cx="100" cy="78" r="44" />
    <path class="Yak_Fringe" fill="#5e4634"
      d="M58 68c4-16 10-28 17-28 5 0 6 10 10 10 4 0 6-13 15-13s11 13 15 13c4 0 5-10 10-10 7 0 13 12 17 28-5-6-10-9-14-7-4 2-6 9-11 9s-7-9-13-9-9 9-13 9-7-7-11-9c-4-2-9 1-14 7z" />
    <circle class="Yak_Eye" fill="#3a2b22" cx="84" cy="82" r="4.5" />
    <circle class="Yak_Eye" fill="#3a2b22" cx="116" cy="82" r="4.5" />
    <circle class="Yak_Glint" fill="#fff" cx="85.6" cy="80.4" r="1.5" />
    <circle class="Yak_Glint" fill="#fff" cx="117.6" cy="80.4" r="1.5" />
    <ellipse class="Yak_Nose" fill="#d99a8d" cx="100" cy="100" rx="10" ry="7" />
    <path class="Yak_Smile" fill="none" stroke="#3a2b22" stroke-width="3"
      stroke-linecap="round" d="M90 110c4 5 16 5 20 0" />
  </g>
</svg>
