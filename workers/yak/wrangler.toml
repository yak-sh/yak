# The kernel Worker (D-32318 §The meta-space, §v1 sequencing): the ONE Worker
# below the app line — hostname and path routing, the Store Durable Object
# (one SQLite graph per (space, app)), session verification, the apex's static
# home page, and an app's files out of R2. Everything above it is an app.
# Local: `wrangler dev` here, or the tests (workers/yak/yak_test.ts and
# src/store/do_test.ts boot it on a probe port). Deploy: `wrangler deploy`
# once the owner points DNS at it — nothing deploys on its own.
name = "yak"
main = "index.ts"
account_id = "0f9613dfd3f0451df0bd0f12a1372ea3"
compatibility_date = "2025-05-08"
# global_fetch_strictly_public sends every outbound fetch out to the public
# internet instead of routing a same-zone hostname back to this Worker. The
# OAuth provider requires it before it will fetch a Client ID Metadata
# Document (identity.ts), because a client_id is a URL a stranger chose and
# same-zone routing would make that URL an SSRF into our own origin.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# The apex and every first-level space hostname, both on the yaks.app zone;
# the zone's Universal certificate covers the wildcard.
routes = [
  { pattern = "yaks.app/*", zone_name = "yaks.app" },
  { pattern = "*.yaks.app/*", zone_name = "yaks.app" },
]

# Under `wrangler dev` a request's URL carries the first route's hostname
# unless told otherwise; the loopback keeps local dev a dev host (route.ts),
# where `x-yak-host` picks the hostname a request stands for.
[dev]
host = "127.0.0.1"

# The meter (usage.ts, T-32757): every hour, on the hour, the Worker reads the
# month so far out of Cloudflare's analytics and writes what each app and each
# space spent. A sweep with no CF_ANALYTICS_TOKEN logs one line and does
# nothing, so this trigger is safe to deploy before the secret exists.
[triggers]
crons = ["0 * * * *"]

# The account whose analytics the meter reads, and whose dispatch namespace an
# app's worker is uploaded into — the same tag as `account_id` above, which the
# runtime is never handed. Not a secret: it is in this file.
[vars]
CF_ACCOUNT = "0f9613dfd3f0451df0bd0f12a1372ea3"

# The per-deploy version id (stream.ts, T-33013): Cloudflare mints a fresh id on
# every `wrangler deploy`, so it is the marker a resumed MCP stream compares to
# know the platform's tool/resource/prompt lists moved — automatic, with no file
# edit. The binding is absent under `wrangler dev` and the workerd probes, so
# stream.ts treats it as optional and falls back to the human VERSION there.
[version_metadata]
binding = "CF_VERSION_METADATA"

# An app's OWN worker.js (dispatch.ts, T-32778): every app's script lives in
# this one Workers for Platforms namespace, named by the app's store. There is
# no local implementation — dispatch namespaces are remote-only
# (developers.cloudflare.com/cloudflare-for-platforms/workers-for-platforms/reference/local-development/)
# — so under `wrangler dev` the binding is undefined and an app serves its
# files. `remote = true` here would point local dev at the deployed namespace;
# it is left off, because a test must not need the account.
[[dispatch_namespaces]]
binding = "DISPATCH"
namespace = "yak-apps"

# The apex's static files: the home page, the store client an app's pages
# import (served back to them at <space>.yaks.app/<app>/api/client.js), and
# the guide the MCP door offers as its one resource. run_worker_first: the
# Worker decides what an asset answers for, so a space's hostname never
# serves the apex's page.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

# One object per signed-in person, holding the MCP stream their connector is
# listening on (stream.ts, T-32734): a deploy in one request writes to the
# stream another request opened, which no Worker isolate can do.
[[durable_objects.bindings]]
name = "WIRE"
class_name = "Wire"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Wire"]

# An app's files. `wrangler dev` simulates the bucket.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "yak-blobs"

# The OAuth provider's own store (identity.ts): registered clients, grants,
# and tokens. `wrangler dev` simulates it and ignores the id.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "64fa009267934abe8bc0c9d23ae01b17"

# Secrets never live in this file. SESSION_SECRET signs the platform session
# cookie (src/token.ts) and keys the sign-in code digests (signin.ts);
# MAIL_TOKEN and MAIL_ACCOUNT are the Cloudflare Email Sending credentials the
# code letters go out on (mail.ts). Each is `wrangler secret put <NAME>` for
# the deploy; locally a .dev.vars line, or `wrangler dev --var NAME:…` the way
# the tests pass them. Unset, no session verifies and no letter sends.
# MAIL_DEV=1 is the local override: a letter becomes an entity in the meta
# store instead of going out. Never set it on a deploy.
# CF_ANALYTICS_TOKEN is the meter's read-only Cloudflare API token (Account
# Analytics Read, T-32759); unset, the hourly sweep meters nothing.
# CF_WORKERS_TOKEN is the one an app's own worker.js is uploaded to the
# dispatch namespace with (Workers Scripts Edit, T-32781); unset, an app's
# files deploy and its worker does not.
# CIMD is not a secret but rides the same door, because that door needs no
# code deploy: `printf off | wrangler secret put CIMD` stops the well-known
# claiming Client ID Metadata Document support, `printf on | ...` restores it,
# and unset means on (identity.ts `cimd`, T-33027).
