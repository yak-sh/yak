# The kernel Worker (D-32318 §The meta-space, §v1 sequencing): the ONE Worker
# below the app line — hostname and path routing, the Store Durable Object
# (one SQLite graph per (space, app)), session verification, the apex's static
# home page, and an app's files out of R2. Everything above it is an app.
# Local: `wrangler dev` here, or the tests (workers/yak/yak_test.ts and
# src/store/do_test.ts boot it on a probe port). Deploy: `wrangler deploy`
# once the owner points DNS at it — nothing deploys on its own.
name = "yak"
main = "index.ts"
account_id = "0f9613dfd3f0451df0bd0f12a1372ea3"
compatibility_date = "2025-05-08"
# global_fetch_strictly_public sends every outbound fetch out to the public
# internet instead of routing a same-zone hostname back to this Worker. The
# OAuth provider requires it before it will fetch a Client ID Metadata
# Document (identity.ts), because a client_id is a URL a stranger chose and
# same-zone routing would make that URL an SSRF into our own origin.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# The apex and every first-level space hostname, both on the yaks.app zone;
# the zone's Universal certificate covers the wildcard. `*/*` is the third
# because a customer's own hostname is not spelled `yaks.app` at all
# (T-33035): traffic for a custom hostname enters this zone and only a
# zone-wide pattern matches it, which is Cloudflare's own instruction for a
# Worker as the fallback origin. The two above are the same Worker and are
# kept for what they say.
#
# This sits ABOVE every table header on purpose. TOML gives a bare key to the
# last table declared, so under `[observability.logs]` these three read as
# `observability.logs.routes` — a field wrangler warns about and ignores, and
# the deploy stops managing the routes rather than saying so (T-33684). The
# routes survived only because they were already on the zone.
routes = [
  { pattern = "yaks.app/*", zone_name = "yaks.app" },
  { pattern = "*.yaks.app/*", zone_name = "yaks.app" },
  { pattern = "*/*", zone_name = "yaks.app" },
]

# Workers logs (T-33178). Off until 2026-09-03, which is why "where did that
# second go" could only be answered by guessing: the platform had no logs at
# all, and every deploy was pushing observability_enabled: false. `logs` is
# console output and thrown errors; `invocation_logs` is the one line per
# request that carries the path, status and duration — the half that answers a
# latency question. Included up to 20M events a month on Workers Paid.
#
# This is telemetry ABOUT the platform and is not where an app's failures go:
# those are `exception` entities in the app's own store, where the person's
# agent reads them (unseen.ts, V-32361). A log nobody opens is not a report.
[observability.logs]
enabled = true
invocation_logs = true

# Under `wrangler dev` a request's URL carries the first route's hostname
# unless told otherwise; the loopback keeps local dev a dev host (route.ts),
# where `x-yak-host` picks the hostname a request stands for.
[dev]
host = "127.0.0.1"

# The meter (usage.ts, T-32757): every hour, on the hour, the Worker reads the
# month so far out of Cloudflare's analytics and writes what each app and each
# space spent. A sweep with no CF_ANALYTICS_TOKEN logs one line and does
# nothing, so this trigger is safe to deploy before the secret exists.
[triggers]
crons = ["0 * * * *"]

# The account whose analytics the meter reads, and whose dispatch namespace an
# app's worker is uploaded into — the same tag as `account_id` above, which the
# runtime is never handed. Not a secret: it is in this file.
[vars]
CF_ACCOUNT = "0f9613dfd3f0451df0bd0f12a1372ea3"

# The zone a customer's own domain is attached to as a Cloudflare for SaaS
# custom hostname (domains.ts, T-33038) — this zone, the one every route above
# is on. Not a secret either: a zone id names a zone, it does not open one.
CF_ZONE = "3b2518c3647029d687bb4f40bebf0f77"

# The recurring price a Plus subscription is for (billing.ts, D-32751): $4 a
# month, live mode. Not a secret — a price id names a price, it does not open
# an account, and it belongs beside the account and zone above rather than in a
# secret store where nobody can read what the site is selling.
STRIPE_PRICE = "price_1UBe7mITlUS6lUlgJqKpCFiV"

# The per-deploy version id (stream.ts, T-33013): Cloudflare mints a fresh id on
# every `wrangler deploy`, so it is the marker a resumed MCP stream compares to
# know the platform's tool/resource/prompt lists moved — automatic, with no file
# edit. The binding is absent under `wrangler dev` and the workerd probes, so
# stream.ts treats it as optional and falls back to the human VERSION there.
[version_metadata]
binding = "CF_VERSION_METADATA"

# An app's OWN worker.js (dispatch.ts, T-32778): every app's script lives in
# this one Workers for Platforms namespace, named by the app's store. There is
# no local implementation — dispatch namespaces are remote-only
# (developers.cloudflare.com/cloudflare-for-platforms/workers-for-platforms/reference/local-development/)
# — so under `wrangler dev` the binding is undefined and an app serves its
# files. `remote = true` here would point local dev at the deployed namespace;
# it is left off, because a test must not need the account.
[[dispatch_namespaces]]
binding = "DISPATCH"
namespace = "yak-apps"

# The apex's static files: the home page, the store client an app's pages
# import (served back to them at <space>.yaks.app/<app>/api/client.js), and
# the guide the MCP door offers as its one resource. run_worker_first: the
# Worker decides what an asset answers for, so a space's hostname never
# serves the apex's page.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

# One object per signed-in person, holding the MCP stream their connector is
# listening on (stream.ts, T-32734): a deploy in one request writes to the
# stream another request opened, which no Worker isolate can do.
[[durable_objects.bindings]]
name = "WIRE"
class_name = "Wire"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Wire"]

# Outbound mail as a binding rather than the REST API (T-33684): Cloudflare
# Email Sending, authorized by this deploy instead of by a token, so nothing
# has to hold a credential to write as the platform. Unrestricted on purpose —
# an app sends from its own `<space>.<app>@yaks.app` (post.ts `mailFrom`,
# T-33686) and that address is not knowable when this file is written; what a
# binding may send FROM is the set of domains onboarded to Email Sending on the
# zone, which is the check that matters.
#
# The Store reads this binding out of its env and hands it to @yaks/mail's
# sending effect (graph.ts). mail.ts still posts to the REST API, and stays
# there: the platform's own sign-in codes go out from bot.yak.sh, which is a
# different Email Sending domain from the one an app's letters leave.
[[send_email]]
name = "MAIL"

# An app's files. `wrangler dev` simulates the bucket.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "yak-blobs"

# Where a Store writes its whole old graph before it migrates to the packages'
# schema (migrate.ts, T-33809): one `rows.jsonl` and one `report.json` per
# object per pass, under `store/<space>/<app>/<when>/`, kept afterwards. It is
# the restore path, so an object with no bucket bound moves nothing and serves
# its old rows read-only. The bucket must EXIST on the account before the
# cutover deploy — `wrangler r2 bucket create yak-store-exports` (T-33808).
[[r2_buckets]]
binding = "EXPORTS"
bucket_name = "yak-store-exports"

# Cloudflare's cache, in front of ONE of this Worker's two entrypoints
# (cache.ts, T-33197). Enabled here so it can be turned on per entrypoint
# below; on its own this line would cache everything, which is the thing that
# must not happen.
[cache]
enabled = true

# WHICH entrypoint, and why it is not the one the browser reaches.
#
# The cache key is the path, the query, the entrypoint and the Worker version.
# It is NOT the hostname: Cloudflare treats a Worker as zoneless and gives one
# Worker one cache across every hostname it answers on. Every space here IS a
# hostname over a shared path namespace — `alice.yaks.app/recipes/app.js` and
# `bob.yaks.app/recipes/app.js` are the same key — and a customer's own domain
# serves its app at `/`, colliding with every other front page. Caching the
# default entrypoint would serve one space's bytes to another space's visitors
# on the second request.
#
# So the default entrypoint is the gateway and never cached: it runs on every
# request, resolves the space and app, and decides who is asking. `Files` is
# behind it, addressed by the app's EID (cache.ts `at`), and holds only bytes —
# nobody's response — which is what makes it safe to share and what makes a
# private app's files as cacheable as a public one's.
#
# Turning `enabled` on for `default` is the one edit in this file that would
# leak one tenant's pages to another. cache.ts `sealed` is the second line of
# defence if it ever happens.
[exports.default]
type = "worker"

  [exports.default.cache]
  enabled = false

[exports.Files]
type = "worker"

  [exports.Files.cache]
  enabled = true

# The gateway's binding to the cached entrypoint — this same Worker, named. The
# hop is what puts Cloudflare's cache between the gateway and the bucket, so a
# warm edge answers an app's file without R2 being touched. Absent under
# `wrangler dev` and the workerd probes, where env.ts `bound` calls files.ts
# in-process and nothing is cached.
[[services]]
binding = "FILES"
service = "yak"
entrypoint = "Files"

# The OAuth provider's own store (identity.ts): registered clients, grants,
# and tokens. `wrangler dev` simulates it and ignores the id.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "64fa009267934abe8bc0c9d23ae01b17"

# Secrets never live in this file. SESSION_SECRET signs the platform session
# cookie (src/token.ts) and keys the sign-in code digests (signin.ts);
# MAIL_TOKEN and MAIL_ACCOUNT are the Cloudflare Email Sending credentials the
# code letters go out on (mail.ts). Each is `wrangler secret put <NAME>` for
# the deploy; locally a .dev.vars line, or `wrangler dev --var NAME:…` the way
# the tests pass them. Unset, no session verifies and no letter sends.
# MAIL_DEV=1 is the local override: a letter becomes an entity in the meta
# store instead of going out. Never set it on a deploy.
# CF_ANALYTICS_TOKEN is the meter's read-only Cloudflare API token (Account
# Analytics Read, T-32759); unset, the hourly sweep meters nothing.
# CF_WORKERS_TOKEN is the one an app's own worker.js is uploaded to the
# dispatch namespace with (Workers Scripts Edit, T-32781); unset, an app's
# files deploy and its worker does not.
# CF_HOSTNAMES_TOKEN attaches a person's own domain as a custom hostname on
# the zone above (Zone → SSL and Certificates → Edit on yaks.app, T-33038);
# unset, domain_attach refuses saying so and nothing is half-attached.
# STRIPE_KEY is the restricted Stripe API key checkout, the customer portal and
# one subscription read speak with (T-32760); STRIPE_WEBHOOK_SECRET is what the
# events Stripe posts to /api/stripe/webhook are verified against
# (billing.ts). Unset, those doors say the paid tier is not switched on here
# rather than half-working, and a webhook that arrives unread is filed where
# the owner sees it.
# CIMD is not a secret but rides the same door, because that door needs no
# code deploy: `printf off | wrangler secret put CIMD` stops the well-known
# claiming Client ID Metadata Document support, `printf on | ...` restores it,
# and unset means on (identity.ts `cimd`, T-33027).

# Where a bare specifier goes. The kernel is Deno source that imports the
# packages by NAME (`@yaks/graph`), which deno resolves through the workspace
# in the repo's one deno.json — wrangler's esbuild has no idea about that, and
# a package resolves for `deno check` and then fails to bundle. So the same
# names are spelled once here, as paths.
#
# The npm ones are aliased too, and only because of WHERE they are imported
# from: esbuild walks up from the importing file, and a `packages/mcp/*.ts`
# has no `node_modules` above it. Each points into this directory's own, which
# is what `npm ci` here fills (package.json), so an SDK subpath is spelled at
# the file it actually is.
[alias]
"@yaks/api" = "../../packages/api/mod.ts"
"@yaks/blob" = "../../packages/blob/mod.ts"
"@yaks/canvas" = "../../packages/canvas/mod.ts"
"@yaks/doc" = "../../packages/doc/mod.ts"
"@yaks/durable-object" = "../../packages/durable-object/mod.ts"
"@yaks/edge" = "../../packages/edge/mod.ts"
"@yaks/effects" = "../../packages/effects/mod.ts"
"@yaks/embedding" = "../../packages/embedding/mod.ts"
"@yaks/fts" = "../../packages/fts/mod.ts"
"@yaks/graph" = "../../packages/graph/mod.ts"
"@yaks/id" = "../../packages/id/mod.ts"
"@yaks/journal" = "../../packages/journal/mod.ts"
"@yaks/mail" = "../../packages/mail/mod.ts"
"@yaks/match" = "../../packages/match/mod.ts"
"@yaks/mcp" = "../../packages/mcp/mod.ts"
"@yaks/member" = "../../packages/member/mod.ts"
"@yaks/memory" = "../../packages/memory/mod.ts"
"@yaks/names" = "../../packages/names/mod.ts"
"@yaks/query" = "../../packages/query/mod.ts"
"@yaks/session" = "../../packages/session/mod.ts"
"@yaks/sql" = "../../packages/sql/mod.ts"
"@yaks/sqlite" = "../../packages/sqlite/mod.ts"
"@yaks/task" = "../../packages/task/mod.ts"
"@yaks/vocab" = "../../packages/vocab/mod.ts"
"@yaks/wake" = "../../packages/wake/mod.ts"
"@yaks/workers" = "../../packages/workers/mod.ts"
"zod" = "./node_modules/zod/index.js"
"@modelcontextprotocol/sdk/server/mcp.js" = "./node_modules/@modelcontextprotocol/sdk/dist/esm/server/mcp.js"
"@modelcontextprotocol/sdk/types.js" = "./node_modules/@modelcontextprotocol/sdk/dist/esm/types.js"
"@modelcontextprotocol/sdk/inMemory.js" = "./node_modules/@modelcontextprotocol/sdk/dist/esm/inMemory.js"
