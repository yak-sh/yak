# yak-sandbox holds the builder's workbench (../sandbox.ts): the Workbench
# Durable Object, @cloudflare/sandbox's Sandbox, and the Cloudflare Container
# behind it (index.ts). Its own Worker because the SDK is code compiled when
# an isolate starts: in the kernel that would be every isolate, a Store waking
# for one query included. Here it is only the isolates that run a sandbox.
#
# No routes and no secrets. The kernel's WORKBENCH binding names this
# script's Workbench class and is the one way in. A container's HTTPS to this
# platform and its spaces goes to the kernel's `SandboxOutbound` over KERNEL,
# where its placeholder is swapped for its grant (../sandbox.ts `swapped`);
# the rest of its network is the whole internet. The kernel's deploy deploys it first, to
# the same environment (../wrangler.ts `siblings`).
#
# enable_ctx_exports is what that swap rides: the SDK hands the container's
# requests to `ContainerProxy` through `ctx.exports`.
name = "yak-sandbox"
main = "index.ts"
account_id = "0f9613dfd3f0451df0bd0f12a1372ea3"
compatibility_date = "2025-05-08"
compatibility_flags = ["nodejs_compat", "enable_ctx_exports"]
workers_dev = false
preview_urls = false
minify = true

[vars]
APEX = "yaks.app"

# Immutable workbench filesystem snapshots, retained until a person purges them.
# The bucket's `workbench-abandoned-uploads` rule aborts a snapshot upload left
# incomplete under `workbench/` after a day (../README.md, bucket setup).
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "yak-blobs"

[observability.logs]
enabled = true
invocation_logs = true

# An idle alarm streams the entire container archive through the SDK and R2.
# Give that invocation the same CPU budget as the kernel's Durable Objects.
[limits]
cpu_ms = 300000

[[services]]
binding = "KERNEL"
service = "yak"
entrypoint = "SandboxOutbound"

[[durable_objects.bindings]]
name = "WORKBENCH"
class_name = "Workbench"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Workbench"]

# The container uses a prebuilt registry image. Its tag is the toolchain
# Dockerfile's hash (base.ts); ../sandbox_test.ts checks its SDK against
# ../package.json. A Worker deploy builds no sandbox image.
#
# `standard-2` — 1 vCPU, 6 GiB, 12 GB of disk — is chosen for rustc: `lite`'s
# sixteenth of a core would spend the whole ten-minute budget (../sandbox.ts
# BUDGET) on one crate, and the image plus a `target/` directory does not fit
# in `lite`'s 2 GB (an image may be as large as the instance's disk). At
# Cloudflare's rates that is about $0.000035 a second, so a build that spends
# its whole budget costs about two cents.
#
# `max_instances` bounds what can be running at once — one sandbox per space,
# so five spaces building simultaneously, and one person holds at most one of
# them on the free tier, two on the Personal plan and three on the Pro plan
# (../sandbox.ts `AWAKE`).
# Raising it is one number.
#
# The toolchain image is stable. yak-front's assets supply the CLI workspace
# on first yak use; a package change builds no sandbox image.
[[containers]]
class_name = "Workbench"
image = "registry.cloudflare.com/0f9613dfd3f0451df0bd0f12a1372ea3/yak-sandbox:base-4899dcb5afb77e5f"
instance_type = "standard-2"
max_instances = 5

[env.staging]
name = "yak-sandbox-staging"
workers_dev = false
preview_urls = false

[env.staging.vars]
APEX = "yaks.fyi"

[[env.staging.r2_buckets]]
binding = "BLOBS"
bucket_name = "yak-blobs-staging"

[env.staging.observability.logs]
enabled = true
invocation_logs = true

[env.staging.limits]
cpu_ms = 300000

[[env.staging.services]]
binding = "KERNEL"
service = "yak-staging"
entrypoint = "SandboxOutbound"

[[env.staging.durable_objects.bindings]]
name = "WORKBENCH"
class_name = "Workbench"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["Workbench"]

[[env.staging.containers]]
class_name = "Workbench"
image = "registry.cloudflare.com/0f9613dfd3f0451df0bd0f12a1372ea3/yak-sandbox:base-4899dcb5afb77e5f"
instance_type = "standard-2"
max_instances = 5
