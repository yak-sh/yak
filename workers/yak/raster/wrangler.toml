# yak-raster draws SVG icons and PDF pages. An SVG becomes a square PNG, how an
# app whose agent wrote icon.svg gets the icon.png a home screen reads
# (../raster.ts). PDFium extracts page text and draws scans for OCR. Its own
# Worker because resvg and PDFium are WebAssembly compiled when an isolate starts:
# in the kernel that would be every isolate, a Store waking for one query
# included. Here it is only the isolates that draw.
#
# No routes, no bindings and no secrets: the kernel's RASTER service binding is
# the one way in, and nothing goes out. The kernel's deploy deploys it first,
# to the same environment (../wrangler.ts `siblings`).
name = "yak-raster"
main = "index.ts"
account_id = "0f9613dfd3f0451df0bd0f12a1372ea3"
compatibility_date = "2026-06-01"
workers_dev = false
preview_urls = false
minify = true

[observability.logs]
enabled = true
invocation_logs = true

[env.staging]
name = "yak-raster-staging"
workers_dev = false
preview_urls = false

[env.staging.observability.logs]
enabled = true
invocation_logs = true
