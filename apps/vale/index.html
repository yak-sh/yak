<!doctype html>
<html lang=en>
  <meta charset=utf-8>
  <meta name=viewport
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Mossvale</title>
  <meta name=description
    content="A voxel world to adventure in with whoever else is here: slimes in the meadow, boars in Whisperwood, walking stones in Craghollow, something old on Thornback Ridge, and roads to places beyond.">
  <meta name=theme-color content="#8cc85c">
  <link rel=icon href=icon.png>
  <link rel=apple-touch-icon href=icon.png>
  <link rel=preconnect href=https://esm.sh crossorigin>
  <link rel=preconnect href=https://fonts.googleapis.com>
  <link rel=preconnect href=https://fonts.gstatic.com crossorigin>
  <link rel=stylesheet
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel=stylesheet href=ui/components.css>
  <!-- @yaks/client, @yaks/rtc and @yaks/vocab as JSR holds them, each
       bundled by esm.sh with what it imports, so it arrives in one file rather
       than a chain of them; the app's own code and three.js are compiled from
       main.ts at deploy. What main.ts waits for is fetched while main.ts is:
       @yaks/client, @yaks/vocab and the store's words (api/vocab.json).
       @yaks/rtc waits for the first voice (voicebox.ts). -->
  <script type=importmap>
  {
    "imports": {
      "@yaks/client": "https://esm.sh/jsr/@yaks/client@0.2.9?bundle",
      "@yaks/rtc": "https://esm.sh/jsr/@yaks/rtc@0.2.9?bundle",
      "@yaks/vocab": "https://esm.sh/jsr/@yaks/vocab@0.2.9?bundle"
    }
  }
  </script>
  <link rel=modulepreload href="https://esm.sh/jsr/@yaks/client@0.2.9?bundle">
  <link rel=modulepreload href="https://esm.sh/jsr/@yaks/vocab@0.2.9?bundle">
  <link rel=preload href=api/vocab.json as=fetch crossorigin>
  <canvas class=Stage></canvas>
  <div class=Hud hidden></div>
  <div class=Gate>
    <div class=Gate_Card>
      <h1 class=Gate_Title>Mossvale</h1>
      <p class=Gate_Lede>A little vale of moss and stone. Whoever else is here
        walks it with you.</p>
      <p class=Gate_Busy>Growing the vale…</p>
    </div>
  </div>
  <script type=module src=main.ts></script>
</html>
