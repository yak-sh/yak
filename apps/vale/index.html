<!doctype html>
<html lang=en>
  <meta charset=utf-8>
  <meta name=viewport
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Mossvale</title>
  <meta name=description
    content="A voxel world to adventure in with whoever else is here: slimes in the meadow, boars in Whisperwood, walking stones in Craghollow, something old on Thornback Ridge, and roads to places beyond.">
  <meta name=theme-color content="#8cc85c">
  <link rel=icon href=icon.png>
  <link rel=apple-touch-icon href=icon.png>
  <link rel=preconnect href=https://esm.sh crossorigin>
  <link rel=preconnect href=https://fonts.googleapis.com>
  <link rel=preconnect href=https://fonts.gstatic.com crossorigin>
  <link rel=stylesheet
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel=stylesheet href=ui/components.css>
  <!-- Slash grammar, completion, drafts, client, Preact and signals share
       slash-runtime.bundle.js, built from slash-runtime.ts. Unpublished
       subpaths must not point at the published 0.2.10 packages. @yaks/rtc is a local browser
       bundle of packages/rtc/mod.ts (deno bundle packages/rtc/mod.ts -o
       apps/vale/rtc.bundle.js), since the published 0.2.10 does not yet have
       the sender diagnostics. Its single file waits for the first voice.
       The app code and three.js are compiled from main.ts at deploy. -->
  <script type=importmap>
  {
    "imports": {
      "@yaks/client": "./slash-runtime.bundle.js",
      "@yaks/cli/grammar": "./slash-runtime.bundle.js",
      "@yaks/ux/completion": "./slash-runtime.bundle.js",
      "@yaks/ux/vocab": "./slash-runtime.bundle.js",
      "@yaks/draft": "./slash-runtime.bundle.js",
      "preact": "./slash-runtime.bundle.js",
      "@preact/signals": "./slash-runtime.bundle.js",
      "@yaks/markdown": "https://esm.sh/jsr/@yaks/markdown@0.2.10?bundle",
      "@yaks/rtc": "./rtc.bundle.js",
      "@yaks/vocab": "./slash-runtime.bundle.js"
    }
  }
  </script>
  <link rel=modulepreload href="./slash-runtime.bundle.js">
  <link rel=preload href=api/vocab.json as=fetch crossorigin>
  <canvas class=Stage></canvas>
  <div class=Hud hidden></div>
  <div class=Gate>
    <div class=Gate_Card>
      <h1 class=Gate_Title>Mossvale</h1>
      <p class=Gate_Lede>A little vale of moss and stone. Whoever else is here
        walks it with you.</p>
      <p class=Gate_Busy>Growing the vale…</p>
    </div>
  </div>
  <script type=module src=main.ts></script>
</html>
