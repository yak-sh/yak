      <ellipse cx="199" cy="161" rx="58" ry="40"
        transform="rotate(18 199 161)" />
      <ellipse cx="291" cy="229" rx="58" ry="40"
        transform="rotate(54 291 229)" />
      <ellipse cx="221" cy="229" rx="58" ry="40"
