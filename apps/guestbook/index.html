<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margaret's 70th Guestbook</title>
<style>
  :root{--sun:#fff3b0;--butter:#ffe066;--gold:#7a5a00;--ink:#3b2f12;--pea:#c2418f;--pea2:#7b4fb3;--leaf:#4d7a3a}
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,'Iowan Old Style',serif;color:var(--ink);background:linear-gradient(#fff9d6,var(--sun));min-height:100vh;line-height:1.5}
  header{text-align:center;padding:2.5rem 1rem 1.5rem;background:var(--butter);border-bottom:6px solid var(--pea);position:relative}
  header svg{width:90px;height:90px}
  .kicker{margin:.5rem 0 0;letter-spacing:.12em;text-transform:uppercase;font-size:.9rem;color:var(--gold)}
  h1{margin:.1rem 0 .5rem;font-size:clamp(2.2rem,8vw,3.6rem);color:#5b1d44}
  .lead{max-width:34rem;margin:0 auto;font-size:1.15rem}
  main{max-width:40rem;margin:0 auto;padding:1.5rem 1rem 3rem}
  form,.card{background:#fff;border:2px solid var(--butter);border-radius:14px;padding:1.2rem;box-shadow:0 2px 0 rgba(122,90,0,.15)}
  h2{margin:0 0 .8rem;color:#5b1d44;font-size:1.4rem}
  label,legend{display:block;font-weight:bold;margin:.8rem 0 .25rem}
  fieldset{border:0;padding:0;margin:0}
  input[type=text],input[type=email],textarea{width:100%;font:inherit;padding:.65rem;border:2px solid #d9c36a;border-radius:8px;background:#fffdf0;color:var(--ink)}
  textarea{min-height:8rem;resize:vertical}
  input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--pea2);outline-offset:1px}
  .opt{display:flex;gap:.5rem;align-items:center;margin:.3rem 0;font-weight:normal}
  .opt input{width:1.2rem;height:1.2rem}
  button{margin-top:1.1rem;font:inherit;font-weight:bold;font-size:1.1rem;padding:.75rem 1.6rem;border:0;border-radius:999px;background:#9c2c72;color:#fff;cursor:pointer;min-height:44px}
  button:hover{background:#7e1f5a}
  button:disabled{opacity:.6}
  #list{margin-top:2rem}
  .msg{background:#fff;border-left:8px solid var(--butter);border-radius:10px;padding:1rem 1.2rem;margin:.9rem 0;box-shadow:0 1px 0 rgba(122,90,0,.2)}
  .msg:nth-child(3n+2){border-left-color:#d9a6cc}
  .msg:nth-child(3n){border-left-color:#b9a4dc}
  .msg p{margin:0 0 .5rem;white-space:pre-wrap;overflow-wrap:anywhere}
  .who{font-weight:bold;color:#5b1d44}
  .tag{font-size:.85rem;color:#6b5a1f;margin-left:.4rem;font-weight:normal}
  .empty{text-align:center;color:#6b5a1f;font-style:italic}
  footer{text-align:center;padding:1rem 1rem 2.5rem;color:#6b5a1f}
  .thanks{display:none;background:#e9f5df;border:2px solid var(--leaf);border-radius:10px;padding:.8rem 1rem;margin-bottom:1rem}
  .thanks.show{display:block}
  .err{color:#a00;margin:.6rem 0 0}
  input[type=file]{width:100%;font:inherit;padding:.5rem;border:2px dashed #d9c36a;border-radius:8px;background:#fffdf0}
  .hint{margin:.3rem 0 0;font-size:.9rem;color:#6b5a1f}
  .previews{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
  .previews img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:2px solid var(--butter)}
  .pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem;margin:.2rem 0 .8rem}
  .pics a{display:block}
  .pics img{width:100%;max-height:260px;object-fit:cover;border-radius:8px;border:2px solid var(--butter);display:block;background:#fffdf0}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 95 C48 70 50 55 50 45" stroke="#4d7a3a" stroke-width="4" fill="none"/>
    <path d="M50 75 C35 72 28 62 25 55 C38 56 47 62 50 75Z" fill="#6a9a4f"/>
    <g transform="translate(50 38)">
      <ellipse cx="-15" cy="-5" rx="15" ry="18" fill="#d86bb0" transform="rotate(-25)"/>
      <ellipse cx="15" cy="-5" rx="15" ry="18" fill="#c2418f" transform="rotate(25)"/>
      <ellipse cx="0" cy="8" rx="10" ry="14" fill="#f3a5d3"/>
    </g>
  </svg>
  <p class="kicker" data-copy="hero.kicker"></p>
  <h1 data-copy="hero.title"></h1>
  <p class="lead" data-copy="hero.lead"></p>
</header>
<main>
  <div class="thanks" id="thanks" role="status" tabindex="-1">Thank you! Your message is in the book. 💛</div>
  <form id="f">
    <h2 data-copy="form.title"></h2>
    <label for="name" data-copy="form.name"></label>
    <input type="text" id="name" maxlength="80" required autocomplete="name">
    <label for="message" data-copy="form.message"></label>
    <textarea id="message" maxlength="2000" required data-copy-placeholder="form.messagePlaceholder" placeholder="Happy birthday!"></textarea>
    <fieldset>
      <legend data-copy="form.here"></legend>
      <label class="opt"><input type="radio" name="here" value="party" checked><span data-copy="form.yes"></span></label>
      <label class="opt"><input type="radio" name="here" value="away"><span data-copy="form.no"></span></label>
    </fieldset>
    <label for="email" data-copy="form.email"></label>
    <input type="email" id="email" maxlength="200" autocomplete="email" aria-describedby="ehint">
    <p class="hint" id="ehint" data-copy="form.emailHint"></p>
    <label for="photos" data-copy="form.photos"></label>
    <input type="file" id="photos" accept="image/*" multiple aria-describedby="phint">
    <p class="hint" id="phint" data-copy="form.photosHint"></p>
    <div class="previews" id="previews"></div>
    <div class="err" id="err" role="alert"></div>
    <button type="submit" id="send" data-copy="form.send"></button>
  </form>
  <section id="list" aria-live="polite">
    <h2 data-copy="list.title"></h2>
    <div id="msgs"></div>
    <p class="empty" id="empty" data-copy="list.empty" hidden></p>
  </section>
</main>
<footer data-copy="foot"></footer>
<script type="module">
import { apply, subscribe, upload } from './api/client.js'
const picker = document.getElementById('photos'), previews = document.getElementById('previews')
picker.addEventListener('change', ()=>{
  previews.replaceChildren()
  if (picker.files.length>4) err.textContent='Please choose up to 4 pictures at a time.'; else err.textContent=''
  for (const file of [...picker.files].slice(0,4)){ const i=document.createElement('img'); i.alt='Chosen picture'; i.src=URL.createObjectURL(file); previews.append(i) }
})
async function shrink(file){
  if (!/^image\/(jpeg|png|webp|gif|heic|heif)/.test(file.type) || file.size<400000 && file.type==='image/jpeg') return file
  try{
    const bmp = await createImageBitmap(file)
    const s = Math.min(1, 1600/Math.max(bmp.width,bmp.height))
    const c = document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s)
    const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height)
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.85))
    return blob ? new File([blob], file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'}) : file
  }catch(e){ return file }
}
const msgs = document.getElementById('msgs'), empty = document.getElementById('empty')
const f = document.getElementById('f'), err = document.getElementById('err'), send = document.getElementById('send')
const thanks = document.getElementById('thanks')
function draw(rows){
  rows = (rows||[]).filter(r=>r.wish&&r.wish.message).sort((a,b)=>String(b.wish.at||'').localeCompare(String(a.wish.at||'')))
  msgs.replaceChildren()
  empty.hidden = rows.length>0
  for (const r of rows){
    const d = document.createElement('div'); d.className='msg'
    const p = document.createElement('p'); p.textContent = r.wish.message
    const w = document.createElement('div'); w.className='who'
    w.textContent = r.wish.name || 'A friend'
    if (r.wish.here){ const t=document.createElement('span'); t.className='tag'
      t.textContent = r.wish.here==='away' ? '🌼 sending love' : '💐 at the party'; w.append(t) }
    const ids = String(r.wish.photos||'').split(/\s+/).filter(x=>/^[0-9a-f]{64}$/.test(x))
    if (ids.length){ const g=document.createElement('div'); g.className='pics'
      for (const id of ids){ const a=document.createElement('a'); a.href='./api/blob/'+id; a.target='_blank'; a.rel='noopener'
        const i=document.createElement('img'); i.loading='lazy'; i.alt='Picture from '+(r.wish.name||'a friend'); i.src='./api/blob/'+id; a.append(i); g.append(a) }
      d.append(g) }
    d.append(p,w); msgs.append(d)
  }
}
subscribe('.wish', draw)
f.addEventListener('submit', async e=>{
  e.preventDefault(); err.textContent=''
  const name = f.name.value.trim(), message = f.message.value.trim()
  if(!name||!message){ err.textContent='Please add your name and a message.'; return }
  if (picker.files.length>4){ err.textContent='Please choose up to 4 pictures at a time.'; return }
  send.disabled = true
  const label = send.textContent
  try{
    const ids=[]
    if (picker.files.length){ send.textContent='Uploading pictures…'
      for (const file of picker.files){ const up = await upload(await shrink(file)); ids.push(up.eid) } }
    const email = f.email.value.trim()
    if (email && !f.email.checkValidity()){ err.textContent='That email address does not look right. You can also leave it blank.'; send.textContent=label; send.disabled=false; return }
    const bundles = [{entity:{eid:'$w'}, wish:{name, message, here:f.here.value, photos:ids.join(' '), at:new Date().toISOString()}}]
    if (email) bundles.push({entity:{eid:'$c'}, thanks_contact:{name, email, wish:'$w'}})
    await apply(bundles)
    f.email.value=''
    f.message.value=''; picker.value=''; previews.replaceChildren(); thanks.classList.add('show'); thanks.focus()
  }catch(x){ err.textContent='Sorry, that did not save. Please try again.' }
  send.textContent = label; send.disabled = false
})
</script>
</body>
</html>
