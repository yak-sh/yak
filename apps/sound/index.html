<!doctype html>
<html lang=en class=full>
  <meta name=viewport content="width=device-width, initial-scale=1.0">
  <link rel=icon href="data:,">
  <link rel=stylesheet href=main.css>
  <link rel=stylesheet href=./index.css>
  <link rel=modulepreload href=./lib/pitch.js>
  <script type=module src=index.js></script>

  <title>Audio Spectrogram</title>

  <header class="full_Part">
    <h1 class="visually-hidden">Audio Spectrogram</h1>
    <div class="note-readout">
      <span id="note-label">Current note</span>
      <output id="current-note" aria-labelledby="note-label" aria-live="off"
        data-empty>—</output>
    </div>
    <nav id=nav class='row right'>
      <a href=# id=save download=sound-frame.png>Save</a>
      <label><input data-store id=live type=checkbox>Live</label>
      <label><input data-store id=max type=checkbox>Max</label>
      <input data-store id=sensitivity type=range min=31 max=150 value=100
        list=ticks title=Sensitivity aria-label=Sensitivity>
      <datalist id=ticks>
        <option>100</option>
      </datalist>
    </nav>
  </header>

  <main id=main class="full_Part">
    <div class="microphone-prompt" id="microphone-prompt">
      <div id="microphone-status"
        role="status">Waiting for microphone access…</div>
      <button id="microphone-retry" type="button"
        hidden>Try microphone again</button>
    </div>
    <canvas id=output></canvas>
  </main>

  <input data-var data-store id=scale type=range min=1 max=10 value=1 step=any
    title=Scale aria-label=Scale>
