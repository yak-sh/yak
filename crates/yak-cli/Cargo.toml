[package]
name = "yak-cli"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "The `yak` command line: read and write an entity-component graph — list, show, search, and gated batch apply — over the yak-kernel."
keywords = ["cli", "graph", "entity-component", "sqlite", "query"]
categories = ["command-line-utilities", "database"]
repository = "https://github.com/yak-sh/yak"
homepage = "https://yak.sh"
exclude = ["*.ts"]

[[bin]]
name = "yak"
path = "src/main.rs"

[dependencies]
# The `yak` binary is self-contained and portable, so it takes the kernel's
# default features, including bundled SQLite.
yak-kernel = { version = "0.1.1", path = "../yak-kernel" }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `yak tui` lives in its own lib crate; the bin stays thin and just calls
# yak_tui::run() from the `tui` subcommand arm. No ratatui code in yak-cli.
yak-tui = { version = "0.1.1", path = "../yak-tui" }

# the profile test builds its own one-table graph rather than reading the
# owner's — the same bundled sqlite the kernel already links
[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
