[package]
name = "yak-kernel"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "The yak graph kernel: an entity-component graph over SQLite — vocabulary, the row/comp model, the wire Change, a filter grammar, a delta-fed cache, and the gated apply() write path."
keywords = ["graph", "entity-component", "sqlite", "database", "kernel"]
categories = ["database", "data-structures"]
repository = "https://github.com/yak-sh/yak"
homepage = "https://yak.sh"
exclude = ["*.ts"]

# `native` carries everything that cannot cross into wasm32 (sqlite, files).
# yak-wasm depends on this crate with default-features = false and gets
# only the pure core: vocab, model, query, cache.
#
# `remote` is the wire reader (remote.rs): a blocking HTTP client and nothing
# else — no async runtime, since a CLI read is one request answered before the
# next line prints. ureq rides without default features on purpose: the wire
# is `http://host:port` (client.ts host()), so TLS would be dead weight.
#
# `bundled` compiles SQLite IN. It is ON by default so the published crate and
# the self-contained `yak` CLI stay dependency-free and portable. But a Rust
# process that CO-WRITES a file a Deno process also opens (a future
# write-capable service, D-22530) MUST NOT enable it: it depends on the kernel
# with `default-features = false` + `["native", "remote"]` so rusqlite links
# the SAME system libsqlite3 the Deno server links. Two SQLite BUILDS sharing
# one WAL wal-index have no cross-build version guard and corrupt the graph —
# that was the T-22622 corruption (C-22669). Same file, same build: the single
# guarantee SQLite actually tests.
[features]
default = ["native", "remote", "bundled"]
native = ["dep:rusqlite", "dep:chrono", "dep:sha2", "dep:uuid", "dep:url"]
remote = ["dep:ureq"]
bundled = ["rusqlite/bundled"]

[dependencies]
rusqlite = { version = "0.40", optional = true }
ureq = { version = "3", default-features = false, optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
sha2 = { version = "0.10", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
# WHATWG URL (servo's rust-url) — guardSettings normalizes a url-typed setting
# value through `new URL()` (default-port, dot-segment, IPv4/IPv6, IDNA host
# canonicalization). Native-only (write.rs), never crosses into wasm. D-22804
# rung 6b (T-22862), operator-decided (C-22864): a faithful port needs the full
# WHATWG parser, not a hand-rolled subset that would silently diverge.
url = { version = "2", optional = true }
