[package]
name = "yak-wasm"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "The yak kernel's pure core compiled for wasm32: a delta-fed graph cache and the filter grammar, with no sqlite, files, or clock."
keywords = ["wasm", "graph", "entity-component", "cache", "webassembly"]
categories = ["wasm", "data-structures"]
repository = "https://github.com/yak-sh/yak"
homepage = "https://yak.sh"
exclude = ["*.ts"]

[lib]
crate-type = ["cdylib"]

[dependencies]
yak-kernel = { version = "0.1.1", path = "../yak-kernel", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
