[package]
name = "yak-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The yak kernel's pure core compiled for wasm32: a delta-fed graph cache and the filter grammar, with no sqlite, files, or clock."
keywords = ["wasm", "graph", "entity-component", "cache", "webassembly"]
categories = ["wasm", "data-structures"]
# TODO: add `repository` at the next point release — the yak-sh GitHub org
# does not exist yet.
exclude = ["*.ts"]

[lib]
crate-type = ["cdylib"]

[dependencies]
yak-kernel = { version = "0.1.0", path = "../yak-kernel", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
