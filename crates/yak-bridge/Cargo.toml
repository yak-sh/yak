[package]
name = "yak-bridge"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "The yak read bridge: an axum + tokio HTTP/WS server that serves the graph's READ wire (/query, /journal, WS join/catchup/live) over yak-kernel's read-only Store + journal Feed, byte-parity with the Deno server."
keywords = ["graph", "entity-component", "sqlite", "axum", "websocket"]
categories = ["database", "web-programming::http-server"]
repository = "https://github.com/yak-sh/yak"
homepage = "https://yak.sh"
exclude = ["*.ts"]

[[bin]]
name = "yak-bridge"
path = "src/main.rs"

[lib]
name = "yak_bridge"
path = "src/lib.rs"

[features]
# Optional self-contained SQLite for disposable deployments.
bundled = ["yak-kernel/bundled"]

[dependencies]
# System-linked by default; keeps `native` (Store, feed, journal, search) and
# `remote` (unused here but cheap, and keeps open_graph() available).
yak-kernel = { version = "0.1.1", path = "../yak-kernel", default-features = false, features = ["native", "remote"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
# The write proxy AND the front proxy (T-22935) forward over plain HTTP; a
# blocking call inside spawn_blocking, so no async client. default-features off
# drops TLS the loopback wire never needs.
ureq = { version = "3", default-features = false }
# The front proxy streams the demoted Deno's response body back to the client
# through a bounded channel; futures-core is the one trait (`Stream`) that lets
# an axum `Body::from_stream` drain that channel. Already in the tree via axum —
# a trait crate, no runtime, nothing new compiled.
futures-core = { version = "0.3", default-features = false }

[dev-dependencies]
# The parity harness drives HTTP and a WS socket against BOTH servers.
ureq = { version = "3", default-features = false }
tungstenite = { version = "0.24" }
