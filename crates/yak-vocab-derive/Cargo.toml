[package]
name = "yak-vocab-derive"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The #[derive(Comp)] proc-macro: an annotated Rust struct IS a vocabulary component (D-22530 §6). It reads the struct + its column fields into a yak_vocab::CompDef and registers it with inventory, so the contract is literally types the compiler checks."
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
