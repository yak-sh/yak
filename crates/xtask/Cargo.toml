[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The vocabulary codegen driver (D-22530 §6): it holds the annotated-Rust contract (the source of truth) and emits the per-plugin data manifest into src/vocab/manifests. `cargo run -p xtask -- vocab` regenerates; `-- vocab --check` (and the crate's own test) fail when the committed manifest is stale against the Rust."
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
yak-vocab = { path = "../yak-vocab" }
yak-vocab-derive = { path = "../yak-vocab-derive" }
inventory = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
