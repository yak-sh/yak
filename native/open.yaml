# iOS asks before a link opens another app: "Open in “Expo Go”?". A tap can
# land before the ask takes it, or as it goes, so it is pressed until gone.
appId: host.exp.Exponent
---
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    while:
      visible: Open
    times: 5
    commands:
      - tapOn:
          text: Open
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
