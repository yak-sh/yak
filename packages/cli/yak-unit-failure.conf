# Install as <unit-template>.service.d/tracker.conf for yak web/worker units.
# ExecStopPost runs even when the main process was killed or timed out. It
# runs after the template's own ExecStopPost lines, and systemd skips it when
# one of those fails, so each of them carries `-` (ExecStopPost=-/usr/bin/rm …).
[Service]
ExecStopPost=%h/.deno/bin/yak unit failure %n --config %h/.yak/yak.json
