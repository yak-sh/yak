<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: the home-indicator strip is space we WANT.
         It is the OS's, so the app's floor stops above it (body's bottom
         padding) and BODY paints it — the notch band's move, mirrored.
         Without cover env() reads 0 and the statusbar sits flush on the
         glass, inside the home gesture, untappable. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1,
        user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2d353b"
      media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fdf6e3"
      media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tasks" />
    <meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />
    <title>Tasks</title>
    <!-- the app bg, inline: no white flash before styles.css lands, and
         the PWA splash (manifest background_color) matches seamlessly -->
    <style>
    html {
      background: #232a2e;
    }
    @media (prefers-color-scheme: light) {
      html {
        background: #efebd4;
      }
    }
    </style>
    <link rel="manifest" href="/web/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/web/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/web/icon-512.png" />
    <link rel="apple-touch-icon" href="/web/apple-touch-icon.png" />
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <script type="module" src="/web/app.js"></script>
  </body>
</html>
