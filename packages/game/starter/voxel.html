<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Voxel exploration starter</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" crossorigin="use-credentials">
  <link rel="stylesheet" href="./style.css">
  <body class="GameScreen">
    <canvas class="GameScreen_Surface Stage"
      aria-label="Voxel exploration world"></canvas>
    <div class="GameScreen_Hud StarterHud">
      <p class="Hint"
        role="status">Move with WASD, arrow keys, or the touch stick.</p>
      <button class="GameScreen_Control StarterHud_Button" id="fullscreen"
        type="button" hidden>
        Enter fullscreen
      </button>
    </div>
    <script type="module" src="./voxel.ts"></script>
  </body>
</html>
