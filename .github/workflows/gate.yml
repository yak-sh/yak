# The gate: what `deno task check` and `deno task test` say about a commit,
# and nothing else.
#
# It does not deploy, nor wait for or time a deploy. The kernel Worker ships
# through Cloudflare Workers Builds, which runs its own build (bin/build-yak)
# and mints its own token — see workers/yak/README.md. How long a push takes to
# go live is Cloudflare's, not the commit's, so the box's deploy catch-up
# times every deploy and reports slower ones as their own bug
# (packages/admin/README.md, "The deploy catch-up").
#
# Runs on our own runner, not GitHub's — we buy no Actions minutes (M-9560).
# It is yak-ci, a c4d-highcpu-8 VM (four cores, eight threads, 15 GB) in GCP
# project justyaks, us-central1-a, off the box's host so agent work here
# cannot slow it. It runs as user `runner` in /opt/actions-runner, under the
# system unit actions.runner.yak-sh-yak.yak-ci.service, and holds no keys
# and no service account. bin/ci-runner-setup installs and registers it.
# Tests run in process through the graph and DOM abstractions, without
# Chrome or platform services. `runs-on` names the custom label `gce`, so a
# workflow can never silently fall back to a hosted runner.
#
#   gcloud compute ssh yak-ci --project justyaks --zone us-central1-a \
#     --command 'systemctl status actions.runner.yak-sh-yak.yak-ci'
#   gh api repos/yak-sh/yak/actions/runners   # does GitHub agree
#
# The repo is public, so a fork PR must never reach the runner: the `if` below
# refuses one, and the repository requires approval before a fork PR workflow
# runs at all (`actions/permissions/fork-pr-contributor-approval` =
# all_external_contributors).
name: gate

on:
  push:
    branches: [main]
  pull_request:
  # A gate on a ref of your choosing, in that ref's own concurrency group, so a
  # busy main cannot cancel it: `gh workflow run gate.yml --ref <branch>`.
  workflow_dispatch:

# One gate per ref at a time. On main a gate that started runs to its verdict,
# and only the newest push waits behind it (GitHub keeps one pending run per
# group, replacing it), so a busy main still says green or red every gate's
# length. Elsewhere a second push supersedes the first.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gce]
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: deno run -A bench/run.ts command --ci bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      # pnpm at package.json's `packageManager`; its store stays on the runner.
      - uses: pnpm/action-setup@v4

      - name: workspace dependencies
        shell: bash
        env:
          SUITE_STEP: workspace dependencies
        run: bin/workspace-dependencies

      # Verbose, here and below: the gate's log is read whole, so it keeps
      # every check's output and every test's line.
      - name: deno task check
        env:
          SUITE_STEP: deno task check
        run: deno task check --all --verbose

      # In-process logic and UI tests; timing is reported beside the budget.
      - name: tests
        env:
          SUITE_STEP: tests
        # All of it (`--all`): this machine keeps no record of what passed
        # before. Local runs leave unchanged files out using their dependency keys.
        run: 'DB_PATH=:memory: deno task test --all --verbose'

      - name: retain suite timings
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: suite-timings
          path: |
            bench/*.results.json
            bench/*.baseline.json
            bench/test-times/*.json
