# The gate: what `deno task check` and `deno task test` say about a commit,
# and nothing else.
#
# It does not deploy, nor wait for or time a deploy. The kernel Worker ships
# through Cloudflare Workers Builds, which runs its own build (bin/build-yak)
# and mints its own token — see workers/yak/README.md. How long a push takes to
# go live is Cloudflare's, not the commit's, so the box's deploy catch-up
# times every deploy and reports slower ones as their own bug
# (packages/admin/README.md, "The deploy catch-up").
#
# Runs on our own runner, not GitHub's — we buy no Actions minutes (M-9560).
# It is gh-runner (LXC 112 on the homelab's pve, beside two other repos'
# runners), as user `yak-runner` in /opt/actions-runner/yak, under the system
# unit actions.runner.yak-sh-yak.gh-runner-yak.service. The homelab repo's
# docs/PROXMOX.md says how it was installed. The gate reads STRIPE_KEY and
# DENO_SQLITE_PATH from its environment (the runner's own .env). The tools the
# tests call are the box's, from apt: google-chrome-stable, sqlite3, rclone
# (bin/backup), and bubblewrap and python3 (packages/process sandboxes).
# yak-runner lingers, so its systemd user manager runs, with cpu, memory and
# pids delegated, for the sandboxes' scopes. `runs-on` names the custom label
# `yak`, so a workflow can never silently fall back to a hosted runner.
#
# Timing runs on CPUs 0-3 (four physical cores). Explicit
# lxc.cgroup2.cpuset.cpus entries in pve's LXC configs keep its balancer
# from moving them: the other running containers use only 4-5,10-11.
# Both the container root and /ns cgroups carry that affinity. Leaving their SMT siblings 6-9 idle prevents agent work
# from stealing the measured core.
#
#   ssh pve 'pct exec 112 -- systemctl status actions.runner.yak-sh-yak.gh-runner-yak'
#   gh api repos/yak-sh/yak/actions/runners   # does GitHub agree
#
# The repo is public, so a fork PR must never reach the runner: the `if` below
# refuses one, and the repository requires approval before a fork PR workflow
# runs at all (`actions/permissions/fork-pr-contributor-approval` =
# all_external_contributors).
name: gate

on:
  push:
    branches: [main]
  pull_request:
  # A gate on a ref of your choosing, in that ref's own concurrency group, so a
  # busy main cannot cancel it: `gh workflow run gate.yml --ref <branch>`.
  workflow_dispatch:

# One gate per ref at a time. On main a gate that started runs to its verdict,
# and only the newest push waits behind it (GitHub keeps one pending run per
# group, replacing it), so a busy main still says green or red every gate's
# length. Elsewhere a second push supersedes the first.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, yak]
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: deno run -A bench/run.ts command --ci bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      # Verbose, here and below: the gate's log is read whole, so it keeps
      # every check's output and every test's line.
      - name: deno task check
        env:
          SUITE_STEP: deno task check
        run: deno task check --verbose

      # Every platform's tests (bin/test.ts), workerd's included, held to the
      # budget (bin/test-budget.ts): a test over 1 ms that
      # bench/test-budget.json does not list fails the step, as on any run;
      # and here, a whole run on the gate, where the records are taken, so
      # does a listed test or workerd's wall slower than its record. The money
      # paths reach Stripe's sandbox, so the runner's environment carries
      # STRIPE_KEY. A job its system unit starts is not told where the user
      # manager listens, and the sandboxes' scopes need it: XDG_RUNTIME_DIR.
      # Quoted: a bare YAML scalar cannot carry a `: ` — the runner would
      # never see this line, the file would fail to parse.
      - name: tests
        env:
          SUITE_STEP: tests
          # An owned base on tmpfs lets scratch sweep cancelled runs' leftovers;
          # scratch makes it.
          TMPDIR: /tmp/yak-gate
        # All of it (`--all`): this machine keeps no record of what passed
        # before, and only a whole run holds the wall.
        run: 'XDG_RUNTIME_DIR=/run/user/$(id -u) DB_PATH=:memory: deno task test --all --verbose'

      - name: retain suite timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-timings
          path: |
            bench/*.results.json
            bench/*.baseline.json
            bench/test-times/*.json
