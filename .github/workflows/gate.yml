# The self-hosted gate advances deploy only after the tests pass. Workers
# Builds must watch deploy, not main (workers/yak/README.md). No Cloudflare
# credential is needed here; Builds still owns the upload and its token.
name: gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Public fork PRs must never execute on this box.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, yak]
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: worker paths
        id: paths
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-$BEFORE}"
          # Include worker changes in a superseded/failed push, even when the
          # newest push only edits docs. Already-promoted docs changes skip it.
          if [ -z "$PR_BASE" ] && git show-ref --verify --quiet refs/remotes/origin/deploy; then
            base=refs/remotes/origin/deploy
          fi
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=$(git hash-object -t tree /dev/null)
          fi
          # A failed diff must fail the gate, never masquerade as no changes.
          git diff --name-only "$base" "$GITHUB_SHA" -- workers/ packages/ > "$RUNNER_TEMP/yak-paths"
          if grep -q . "$RUNNER_TEMP/yak-paths"; then
            echo 'workers=true' >> "$GITHUB_OUTPUT"
          fi

      - name: deno task check
        run: deno task check

      - name: tests
        run: 'DB_PATH=:memory: deno task test'

      # The fast tier skips slow(...). This tier boots real workerd/SQLite;
      # probe.ts installs the pinned npm dependencies on a fresh checkout.
      - name: workerd tests
        if: steps.paths.outputs.workers == 'true'
        run: deno task test:workerd

      - name: app deploy gate
        run: deno task app-deploy:gate

      - name: bench gate
        run: deno task bench:gate

      - name: advance production branch
        id: promote
        if: github.event_name == 'push' && steps.paths.outputs.workers == 'true'
        run: |
          echo "pushed=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          bin/promote-yak "$GITHUB_SHA"

      # Time the deployment branch push, not the preceding workerd tests.
      # Start immediately after promotion so the first live probe is honest.
      - name: deploy time
        if: steps.promote.outcome == 'success'
        env:
          DEPLOY_PUSHED_AT: ${{ steps.promote.outputs.pushed }}
        run: deno task deploy:time ${{ github.sha }}

      - name: deploy gate
        if: steps.promote.outcome == 'success'
        run: deno task deploy:gate
