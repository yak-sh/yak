# The gate: what `deno task check` and the test tiers say about a commit.
#
# It does not deploy. The kernel Worker ships through Cloudflare Workers Builds,
# which runs its own build (bin/build-yak) and mints its own token — see
# workers/yak/README.md. Nothing here holds a Cloudflare credential: the one
# step that reads Cloudflare (deploy time) runs wrangler against the box's own
# login under $HOME, the way the box does by hand.
#
# Runs on THIS box, not GitHub's — we buy no Actions minutes (M-9560). The
# runner is a `systemd --user` unit; its install, its PATH and the command that
# removes it are all in etc/actions-runner.service. `runs-on` names the custom
# label `yak`, so a workflow can never silently fall back to a hosted runner.
#
#   systemctl --user status actions-runner    # is it listening
#   gh api repos/yak-sh/yak/actions/runners   # does GitHub agree
#
# The repo is public, so a fork PR must never reach this box: the `if` below
# refuses one, and the repository requires approval before a fork PR workflow
# runs at all (`actions/permissions/fork-pr-contributor-approval` =
# all_external_contributors).
name: gate

on:
  push:
    branches: [main]
  pull_request:

# One gate per ref. A second push supersedes the first — nobody reads the
# verdict on a commit that is already history.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, yak]
    timeout-minutes: 30
    defaults:
      run:
        shell: deno run -A bin/suite-time.ts --ci bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          # The workerd tier scopes itself by diff, so the base commit of a
          # push must be in the clone.
          fetch-depth: 0

      - name: worker paths
        id: paths
        env:
          SUITE_STEP: worker paths
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-$BEFORE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=$(git hash-object -t tree /dev/null)
          fi
          # A failed diff must fail the gate, never masquerade as no changes.
          git diff --name-only "$base" "$GITHUB_SHA" -- workers/ packages/ > "$RUNNER_TEMP/yak-paths"
          if grep -q . "$RUNNER_TEMP/yak-paths"; then
            echo 'workers=true' >> "$GITHUB_OUTPUT"
          fi

      # FIRST, before a single test: `live` is the recorder's first successful
      # probe, so whatever the job does before this step is measured as deploy
      # latency. Run last (T-35336), the recorder reached the probe ~2m30 after
      # the push, found the version long since serving, and wrote that 2m30 as
      # the number — 175.689s for d03e4fba, 180.670s for d59bb215, 203.932s for
      # ef364c57, each of them `upload` under a minute. Three REGRESSIONs in a
      # row that were the gate timing its own test suite (T-35426).
      #
      # The commit under test times its own deploy. Push only: a PR has no main
      # push to time. A push outside the Worker's watch paths deploys nothing,
      # and the recorder says so instead of waiting (workers/yak/README.md). No
      # Actions secret is added — the recorder uses the box's own gh and
      # wrangler logins under $HOME. Nothing here pushes, so the row lands in
      # this run's checkout and in the job summary; commit it with the next
      # change, like bench-gate's baseline. A bench-row commit on main would
      # start another Workers Build and another gate.
      - name: deploy time
        if: github.event_name == 'push'
        env:
          SUITE_STEP: deploy time
        run: deno task deploy:time ${{ github.sha }}

      - name: deno task check
        env:
          SUITE_STEP: deno task check
        run: deno task check

      # Quoted: a bare YAML scalar cannot carry a `: ` — the runner would never
      # see this line, the file would fail to parse.
      - name: tests
        env:
          SUITE_STEP: tests
        run: 'DB_PATH=:memory: deno task test'

      # No install step: the Worker's npm dependencies are gitignored, and
      # since T-34159 the probe fills them itself (workers/yak/wrangler.ts
      # `ready()`, called from probe.ts) before workerd reads them.
      #
      # @db/sqlite ships a prebuilt libsqlite3.so that segfaults on this box the
      # moment it is opened. Nothing here has to say so any more: since T-34183
      # every importer takes `Database` from @yaks/sqlite/db, whose prelude names
      # the system library first (packages/sqlite/sqlitepath_test.ts holds that
      # line). Before that, these runs only survived because every login shell
      # here exports DENO_SQLITE_PATH and a systemd unit inherits none of it.
      # The fast tier skips slow(...); this one boots real workerd and SQLite,
      # so it runs where the diff touches those paths. It REPORTS: a red
      # workerd tier is a bug to fix, never a held-back deploy (T-37250).
      - name: workerd tests
        if: steps.paths.outputs.workers == 'true'
        continue-on-error: true
        env:
          SUITE_STEP: workerd tests
        run: deno task test:workerd

      # Reads the row `deploy time` wrote; needs no credentials. Until
      # T-35336 rows were only written when someone hand-ran deploy:time, so
      # one unlucky Workers Builds row (39–71s, Cloudflare-side) stayed "the
      # latest deploy" and failed every later commit.
      - name: deploy gate
        env:
          SUITE_STEP: deploy gate
        run: deno task deploy:gate

      # Box-side app-deploy:time records what an app_files write costs a person;
      # this reads the committed rows and refuses a slower one (T-34986).
      - name: app deploy gate
        env:
          SUITE_STEP: app deploy gate
        run: deno task app-deploy:gate

      # Reports a regression against the committed floor; it does not block.
      - name: bench gate
        continue-on-error: true
        env:
          SUITE_STEP: bench gate
        run: deno task bench:gate

      - name: retain suite timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-timings
          path: |
            bench/results.json
            bench/suite.baseline.json
