# The iOS shell (native/) once through on a simulator, in Expo Go, signed in
# as checks: native/simulator.yaml drives it with Maestro and screenshots each
# screen into the run's artifacts. Run by hand when the shell changes:
#
#   gh workflow run ios-shell --ref <branch>
#
# A hosted runner, as macos.yml's: GitHub's standard runners cost nothing for
# a public repository, and it never touches the box. CHECKS_SIGNIN_LINK is a
# standing sign-in link for checks@bot.yak.sh (`POST /login/link`, minted
# from a checks session); a run with an expired one stops at the sign-in card.
name: ios-shell

on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: shell dependencies
        working-directory: native
        run: npm ci
      - name: the bundle compiles for Hermes
        working-directory: native
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/export"
      - name: an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted(k for k in d if "iOS" in k)
          print(next(x["udid"] for x in d[ios[-1]] if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$id"
          xcrun simctl bootstatus "$id"
          xcrun simctl list devices booted
      - name: Expo Go
        run: |
          url=$(curl -fsS https://api.expo.dev/v2/versions/latest | python3 -c '
          import json, sys
          print(json.load(sys.stdin)["data"]["sdkVersions"]["58.0.0"]["iosClientUrl"])')
          mkdir -p "$RUNNER_TEMP/ExpoGo.app"
          curl -fsSL "$url" | tar xz -C "$RUNNER_TEMP/ExpoGo.app"
          xcrun simctl install booted "$RUNNER_TEMP/ExpoGo.app"
      - name: Metro
        working-directory: native
        run: |
          # Offline: an anonymous manifest, since the runner is signed in to no
          # Expo account to sign one for this project with. Expo Go asks for
          # the manifest twice at once, and both asks write the CLI's missing
          # code-signing settings file, one failing; it is written first here.
          project=$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["extra"]["eas"]["projectId"])')
          mkdir -p ~/.expo/codesigning/$project
          echo '{}' > ~/.expo/codesigning/$project/development-code-signing-settings-2.json
          CI=1 nohup npx expo start --port 8081 --go --offline > "$RUNNER_TEMP/metro.log" 2>&1 &
          until curl -fsS http://127.0.0.1:8081/status; do sleep 2; done
          # The bundle before Expo Go asks for it, so the flow does not wait on
          # its first build.
          manifest='-H expo-platform:ios -H accept:application/expo+json,application/json'
          bundle=$(curl -fsS $manifest http://127.0.0.1:8081 | python3 -c '
          import json, sys
          print(json.load(sys.stdin)["launchAsset"]["url"])')
          time curl -fsS -o /dev/null "$bundle"
          nohup xcrun simctl spawn booted log stream --style compact \
            --predicate 'process CONTAINS "Expo"' > "$RUNNER_TEMP/device.log" 2>&1 &
      - name: Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: through the shell
        env:
          LINK: ${{ secrets.CHECKS_SIGNIN_LINK }}
          # Its driver takes minutes to start on a hosted runner's first run.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
          MAESTRO_CLI_NO_ANALYTICS: 1
        run: |
          pass="${LINK#*\?}"
          echo "::add-mask::${pass#t=}"
          mkdir -p shots
          cd shots
          maestro test --test-output-dir "$RUNNER_TEMP/maestro" -e SIGNIN="exp://127.0.0.1:8081/--/login/link?$pass" ../native/simulator.yaml
      - name: what the simulator showed last
        if: always()
        run: |
          mkdir -p shots
          # The flow's own screenshots, and none of Maestro's debug output,
          # whose command log holds the sign-in link.
          find native shots "$RUNNER_TEMP/maestro" ~/.maestro/tests -name '[0-9]-*.png' \
            -exec cp {} shots/ \; 2>/dev/null || true
          xcrun simctl io booted screenshot shots/last.png || true
          pass="${LINK#*\?}"
          for f in metro device; do
            sed "s/${pass#t=}/…/g" "$RUNNER_TEMP/$f.log" > "shots/$f.log" || true
          done
        env:
          LINK: ${{ secrets.CHECKS_SIGNIN_LINK }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-shell
          path: shots
