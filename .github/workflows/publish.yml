# Publish the @yaks/* family to JSR.
#
# A tag v* publishes the release bin/release.ts cut. Main's CI already
# validates publication through `deno task check:types --all`, including the
# package-local Deno settings and public types, after each push.
#
# No token. JSR takes GitHub's OIDC identity (`id-token: write`) and trusts it
# because the package is LINKED to this repository on jsr.io — which is the
# owner's to do, once (T-34168). Until then the publish step would fail on
# every tag with an authorization error, so it is guarded by a repository
# variable the owner sets in the same sitting:
#
#   gh variable set JSR_LINKED --body 1
#
# Set it only after every @yaks/* package on jsr.io names yak-sh/yak as its
# linked repository. A version cannot be unpublished.
name: publish

on:
  push:
    tags: ['v*']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, yak]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # bin/publish.ts imports workspace packages, which resolve through
      # node_modules: each member's name and exports live in its package.json.
      - uses: pnpm/action-setup@v4

      - name: workspace dependencies
        run: deno run -A packages/cli/dependencies.ts

      - name: are the packages linked on jsr.io yet
        id: linked
        run: |
          if [ "${{ vars.JSR_LINKED }}" != "1" ]; then
            echo "JSR_LINKED is not 1 — the @yaks/* packages are not linked to this repo on jsr.io yet (T-34168 is the owner's). Not publishing ${{ github.ref_name }}."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      # The same one command, without `--allow-dirty`: a tag's checkout is
      # pristine, and a tree that is not is a reason to stop.
      - name: deno publish
        if: steps.linked.outputs.go == 'yes'
        run: deno task publish
