# The members, as package.json's `workspaces` names them for Deno and our tools
# (packages/cli/dependencies.ts `members`).
packages:
  - packages/*
  - workers/yak
# Members depend on each other by their published version: link them.
linkWorkspacePackages: true
# Members import each other in cycles; pnpm links them all the same.
ignoreWorkspaceCycles: true
# Scripts, benches, apps and the other Workers import every member from the
# repository root.
publicHoistPattern:
  - '@yaks/*'
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# linkedom calls a listener an event bubbles to with the event's target as
# `this`, where Preact looks for its handler; the patch calls it with the
# element listening (`currentTarget`), as a browser does. A node's properties
# link its whole document, so inspection walks every node; the patch shows
# the node's markup instead.
patchedDependencies:
  linkedom@0.18.15: patches/linkedom@0.18.15.patch
